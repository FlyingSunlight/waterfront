    <circle cx="183" cy="201" r="2.7" fill="#f2efe9"/>
    <circle cx="188.5" cy="204" r="2.7" fill="#f2efe9"/>
    <circle cx="194" cy="206" r="2.7" fill="#f2efe9"/>
    <circle cx="200" cy="207" r="2.7" fill="#f2efe9"/>
    <circle cx="206" cy="206" r="2.7" fill="#f2efe9"/>
    <circle cx="211.5" cy="204" r="2.7" fill="#f2efe9"/>
    <circle cx="217" cy="201" r="2.7" fill="#f2efe9"/>
