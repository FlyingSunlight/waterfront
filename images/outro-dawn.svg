<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Dawn over the fjord: warm amber and brass light on the horizon, a small ferry crossing calm water, and a family of three standing quietly on a headland looking out">
