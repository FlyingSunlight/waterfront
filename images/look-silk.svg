    <path d="M196 52 C168 54 152 76 154 108 C155 128 159 146 168 158 C176 168 186 173 193 173 C205 173 218 162 228 146 C238 130 242 108 240 88 C236 62 220 50 196 52 Z"/>
    <!-- neck -->
    <path d="M176 166 C177 182 175 194 171 205 L230 202 C225 190 224 176 224 158 C210 170 190 174 176 166 Z"/>
    <!-- décolleté -->
    <path d="M171 205 C182 218 191 240 200 252 C209 240 220 216 230 202 Z"/>
  </g>

  <!-- ===== hair : long straight, centre part ===== -->
  <path d="M126 252 C130 200 132 156 132 116 C132 68 158 40 198 40 C240 40 264 68 264 116 C264 156 266 200 270 252 L254 252 C250 200 246 160 246 122 C245 108 240 100 236 100 C232 78 214 62 190 58 C170 64 160 80 157 98 C155 106 152 112 150 118 C148 156 144 210 138 252 Z"
        fill="#0c0c10" opacity="0.92"/>
  <g fill="none" stroke="url(#slv)" stroke-linecap="round" stroke-linejoin="round">
