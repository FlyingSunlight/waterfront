    <path d="M132 116 C132 68 158 40 198 40 C240 40 264 68 264 116 C264 156 266 200 270 252" stroke-width="2.2"/>
    <path d="M132 116 C132 156 130 200 126 252" stroke-width="2.2"/>
    <!-- hairline / centre part -->
    <path d="M190 58 C170 64 160 80 157 98 C155 106 152 112 150 118" stroke-width="1.2"/>
    <path d="M190 58 C214 62 232 78 236 100 C240 100 245 108 246 122" stroke-width="1.2"/>
    <!-- flowing strands -->
    <path d="M190 58 C174 70 164 88 162 104" stroke-width="0.8"/>
    <path d="M190 58 C214 56 238 74 244 100" stroke-width="0.8"/>
    <path d="M176 48 C156 60 146 84 145 112 C144 156 141 204 134 250" stroke-width="0.9"/>
    <path d="M218 46 C240 58 252 84 253 112 C253 156 257 204 263 250" stroke-width="0.9"/>
    <path d="M139 140 C139 184 136 220 130 250" stroke-width="0.7"/>
    <path d="M258 140 C258 184 261 220 266 250" stroke-width="0.7"/>
    <path d="M246 130 C247 170 249 210 253 248" stroke-width="0.7"/>
    <path d="M150 126 C148 168 146 210 141 248" stroke-width="0.7"/>
  </g>

  <!-- ===== face line work ===== -->
  <g fill="none" stroke="url(#slv)" stroke-linecap="round" stroke-linejoin="round">
