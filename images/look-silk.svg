    <path d="M231 116 C240 113 243 123 239 133 C237 139 233 142 230 139" stroke-width="1.3"/>
    <!-- eyebrows -->
    <path d="M163 103 C168 98 176 96 183 99" stroke-width="1.5"/>
    <path d="M198 99 C205 95 217 96 224 101" stroke-width="1.5"/>
    <!-- far eye -->
    <path d="M165 113 C170 110 178 110 182 113" stroke-width="1.4"/>
    <path d="M168 116.5 C172 118 178 118 181 115.5" stroke-width="0.8"/>
    <!-- near eye -->
    <path d="M197 113 C202 109 212 109 217 113" stroke-width="1.4"/>
    <path d="M199 116.5 C204 118 212 118 216 114.5" stroke-width="0.8"/>
    <!-- nose -->
    <path d="M187 112 C185 124 182 134 179 140" stroke-width="1"/>
    <path d="M179 140 C182 143 187 144 191 142" stroke-width="1"/>
    <!-- lips -->
    <path d="M178 152 C182 149.8 185 150.2 187.5 152 C190 150.2 194 149.8 197 152" stroke-width="1.3"/>
    <path d="M180 155.5 C185 158.4 192 158.4 196 154.8" stroke-width="1.1"/>
    <!-- neck -->
