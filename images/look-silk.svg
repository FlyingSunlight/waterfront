    <path d="M224 160 C225 176 226 190 230 202" stroke-width="1.6"/>
    <!-- collarbone hints -->
    <path d="M176 210 C186 214 194 215 199 214" stroke-width="0.8"/>
    <path d="M226 209 C216 213 208 214 203 213" stroke-width="0.8"/>
  </g>
  <!-- irises -->
  <g stroke="url(#slv)" stroke-width="1" fill="none">
    <path d="M171 111.5 A 2.6 2.6 0 0 0 171 116.5 A 2.6 2.6 0 0 0 176.4 114"/>
    <path d="M204.5 111.2 A 2.7 2.7 0 0 0 204.5 116.4 A 2.7 2.7 0 0 0 210 113.8"/>
  </g>
  <g fill="#c9cdd6">
    <circle cx="173.4" cy="114" r="1.1"/>
    <circle cx="207.2" cy="113.8" r="1.1"/>
  </g>

  <!-- ===== silk blouse : soft collar, fluid drape ===== -->
  <g fill="none" stroke="url(#slv2)" stroke-linecap="round" stroke-linejoin="round">
    <!-- shoulders -->
    <path d="M168 205 C140 214 112 226 96 244 C88 254 84 272 82 300" stroke-width="2"/>
    <path d="M234 202 C262 212 290 224 306 242 C314 252 318 272 320 300" stroke-width="2"/>
    <!-- open collar, soft rolled lines -->
    <path d="M166 206 C176 220 188 240 200 254 C212 240 226 218 236 204" stroke-width="1.6"/>
    <path d="M160 209 C154 226 158 252 172 274 C182 260 192 258 200 254" stroke-width="1.3"/>
    <path d="M242 206 C248 224 244 250 230 272 C220 258 208 258 200 254" stroke-width="1.3"/>
    <!-- fluid drape lines -->
    <path d="M132 236 C126 254 122 276 120 298" stroke-width="0.8"/>
    <path d="M272 234 C278 252 282 274 284 296" stroke-width="0.8"/>
    <path d="M172 278 C170 286 169 292 168 300" stroke-width="0.7"/>
    <path d="M230 276 C232 284 233 292 234 300" stroke-width="0.7"/>
    <path d="M200 260 C199 274 199 288 200 300" stroke-width="0.7"/>
  </g>

  <!-- ===== chain + feather pendant at sternum ===== -->
  <g fill="none" stroke="url(#slv)" stroke-linecap="round">
    <path d="M180 206 C188 220 195 229 199 236" stroke-width="0.9" stroke-dasharray="2 1.6"/>
    <path d="M223 203 C213 219 205 229 201 236" stroke-width="0.9" stroke-dasharray="2 1.6"/>
    <circle cx="200" cy="239" r="2.2" stroke-width="1"/>
  </g>
  <g stroke="url(#slv)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 242 C206 248 208 258 204 268 C202 273 199 275 197 273 C193 268 192 255 195 247 Z" fill="#17171c" stroke-width="1.2"/>
    <path d="M199.5 244 C198.5 252 197.5 262 197 271" stroke-width="0.8" fill="none"/>
    <g stroke-width="0.6" fill="none">
      <path d="M199 249 L203.5 247"/>
      <path d="M198.6 253 L204.5 251"/>
      <path d="M198.2 257 L204.8 255.5"/>
      <path d="M197.8 261 L204.2 260"/>
      <path d="M197.5 265 L202.8 264.5"/>
      <path d="M199 249 L195.5 248"/>
      <path d="M198.6 253 L194.5 252.5"/>
      <path d="M198.2 257 L194 257"/>
      <path d="M197.8 261 L194.4 261.5"/>
    </g>
  </g>
</svg>
