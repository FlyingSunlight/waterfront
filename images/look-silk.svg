<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="シルクブラウスにフェザーペンダントの女性">
  <defs>
    <linearGradient id="slv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="slv2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#101014"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BCEFA" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5BCEFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-p" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A9B8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F5A9B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="100" cy="240" rx="160" ry="130" fill="url(#glow-b)"/>
  <ellipse cx="310" cy="240" rx="160" ry="130" fill="url(#glow-p)"/>

  <!-- ===== skin tonal fills (warm ivory) ===== -->
  <g fill="#e8cdb5" opacity="0.3">
