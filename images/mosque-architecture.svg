<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="A mosque with a teal dome and slender minaret standing among ordinary Norwegian apartment buildings under a pale winter sky, with people arriving on foot.">
<title>A mosque in the Norwegian streetscape</title>
<defs>
  <linearGradient id="winterSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1b3a55"/>
    <stop offset="45%" stop-color="#1b3a55"/>
    <stop offset="100%" stop-color="#eeeae1"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="0.78" cy="0.22" r="0.5">
    <stop offset="0%" stop-color="#e8a33d" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#e8a33d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="domeShine" cx="0.35" cy="0.28" r="0.75">
    <stop offset="0%" stop-color="#4fb8b8"/>
    <stop offset="60%" stop-color="#1f8a8a"/>
    <stop offset="100%" stop-color="#1b3a55"/>
  </radialGradient>
</defs>

<rect x="0" y="0" width="1200" height="400" fill="url(#winterSky)"/>
<rect x="0" y="0" width="1200" height="400" fill="url(#sunGlow)"/>
<circle cx="940" cy="110" r="46" fill="#f7f5f0" opacity="0.9"/>
<rect x="0" y="400" width="1200" height="160" fill="#eeeae1"/>
<rect x="0" y="400" width="1200" height="10" fill="#e4ded2"/>

<!-- ============ Ordinary apartment blocks flanking the mosque ============ -->
<g>
  <!-- left block -->
  <rect x="0" y="230" width="230" height="180" fill="#1b3a55"/>
  <rect x="0" y="222" width="230" height="12" fill="#12293e"/>
  <g fill="#eeeae1" opacity="0.8">
    <rect x="16" y="250" width="26" height="30"/>
    <rect x="56" y="250" width="26" height="30"/>
    <rect x="96" y="250" width="26" height="30"/>
    <rect x="136" y="250" width="26" height="30"/>
    <rect x="176" y="250" width="26" height="30"/>
    <rect x="16" y="300" width="26" height="30"/>
    <rect x="56" y="300" width="26" height="30"/>
    <rect x="96" y="300" width="26" height="30"/>
    <rect x="136" y="300" width="26" height="30"/>
    <rect x="176" y="300" width="26" height="30"/>
    <rect x="16" y="350" width="26" height="30"/>
    <rect x="56" y="350" width="26" height="30"/>
    <rect x="96" y="350" width="26" height="30"/>
    <rect x="136" y="350" width="26" height="30"/>
    <rect x="176" y="350" width="26" height="30"/>
  </g>
  <!-- small balconies -->
  <rect x="14" y="330" width="30" height="4" fill="#c9a227" opacity="0.7"/>
  <rect x="134" y="330" width="30" height="4" fill="#c9a227" opacity="0.7"/>

  <!-- right block -->
  <rect x="960" y="260" width="240" height="150" fill="#12293e"/>
  <rect x="960" y="252" width="240" height="12" fill="#0b1d2e"/>
  <g fill="#eeeae1" opacity="0.75">
    <rect x="978" y="280" width="28" height="32"/>
    <rect x="1020" y="280" width="28" height="32"/>
    <rect x="1062" y="280" width="28" height="32"/>
    <rect x="1104" y="280" width="28" height="32"/>
    <rect x="1146" y="280" width="28" height="32"/>
    <rect x="978" y="330" width="28" height="32"/>
    <rect x="1020" y="330" width="28" height="32"/>
    <rect x="1062" y="330" width="28" height="32"/>
    <rect x="1104" y="330" width="28" height="32"/>
    <rect x="1146" y="330" width="28" height="32"/>
  </g>
</g>

<!-- ============ Minaret ============ -->
<g>
  <rect x="856" y="140" width="26" height="270" fill="#1f8a8a"/>
  <rect x="856" y="140" width="26" height="270" fill="none"/>
  <!-- girih banding -->
  <g stroke="#e0c163" stroke-width="2" opacity="0.7">
    <line x1="856" y1="190" x2="882" y2="190"/>
    <line x1="856" y1="230" x2="882" y2="230"/>
    <line x1="856" y1="270" x2="882" y2="270"/>
    <line x1="856" y1="310" x2="882" y2="310"/>
    <line x1="856" y1="350" x2="882" y2="350"/>
  </g>
  <rect x="848" y="200" width="42" height="14" fill="#c9a227"/>
  <path d="M846 200 L869 176 L892 200 Z" fill="#1f8a8a"/>
  <path d="M856 140 L882 140 L869 118 Z" fill="#4fb8b8"/>
  <circle cx="869" cy="108" r="6" fill="#c9a227"/>
  <line x1="869" y1="108" x2="869" y2="94" stroke="#c9a227" stroke-width="3"/>
  <circle cx="869" cy="90" r="4" fill="#e0c163"/>
</g>

<!-- ============ Mosque main hall ============ -->
<g>
  <rect x="480" y="290" width="330" height="120" fill="#e4ded2"/>
  <rect x="480" y="282" width="330" height="10" fill="#1b3a55"/>

  <!-- entrance arch -->
  <path d="M600 410 L600 350 Q625 320 650 350 L650 410 Z" fill="#0b1d2e"/>
  <path d="M600 350 Q625 322 650 350" fill="none" stroke="#c9a227" stroke-width="3"/>

  <!-- flanking arched windows with geometric tile inset -->
  <g>
    <path d="M510 400 L510 356 Q525 336 540 356 L540 400 Z" fill="#1f8a8a" opacity="0.85"/>
    <path d="M510 356 Q525 338 540 356" fill="none" stroke="#e0c163" stroke-width="2"/>
    <path d="M750 400 L750 356 Q765 336 780 356 L780 400 Z" fill="#1f8a8a" opacity="0.85"/>
    <path d="M750 356 Q765 338 780 356" fill="none" stroke="#e0c163" stroke-width="2"/>
  </g>

  <!-- girih star band across facade -->
  <g fill="none" stroke="#c9a227" stroke-width="1.6" opacity="0.75">
    <path d="M500 320 L515 305 L530 320 L515 335 Z"/>
    <path d="M530 320 L545 305 L560 320 L545 335 Z"/>
    <path d="M560 320 L575 305 L590 320 L575 335 Z"/>
    <path d="M590 320 L605 305 L620 320 L605 335 Z"/>
    <path d="M690 320 L705 305 L720 320 L705 335 Z"/>
    <path d="M720 320 L735 305 L750 320 L735 335 Z"/>
    <path d="M750 320 L765 305 L780 320 L765 335 Z"/>
    <path d="M780 320 L795 305 L810 320 L795 335 Z"/>
  </g>

  <!-- drum beneath dome -->
  <rect x="590" y="255" width="140" height="40" fill="#eeeae1"/>
  <g fill="none" stroke="#1f8a8a" stroke-width="2" opacity="0.8">
    <path d="M600 290 L612 270 L624 290"/>
    <path d="M628 290 L640 270 L652 290"/>
    <path d="M656 290 L668 270 L680 290"/>
    <path d="M684 290 L696 270 L708 290"/>
    <path d="M712 290 L724 270 L736 290"/>
  </g>
</g>

<!-- ============ Dome, with snow ============ -->
<g>
  <ellipse cx="660" cy="258" rx="98" ry="30" fill="#1b3a55" opacity="0.3"/>
  <path d="M562 258 Q562 155 660 140 Q758 155 758 258 Z" fill="url(#domeShine)"/>
  <path d="M562 258 Q660 235 758 258 Q660 275 562 258 Z" fill="#f7f5f0" opacity="0.92"/>
  <path d="M600 250 Q660 232 720 250 Q660 262 600 250 Z" fill="#eeeae1"/>
  <!-- geometric ribbing -->
  <g stroke="#1f8a8a" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M660 140 Q640 195 636 250"/>
    <path d="M660 140 Q660 195 660 252"/>
    <path d="M660 140 Q680 195 684 250"/>
    <path d="M660 140 Q615 205 590 248"/>
    <path d="M660 140 Q705 205 730 248"/>
  </g>
  <!-- finial -->
  <line x1="660" y1="140" x2="660" y2="108" stroke="#c9a227" stroke-width="3"/>
  <circle cx="660" cy="100" r="7" fill="#c9a227"/>
  <path d="M652 100 Q660 88 668 100" fill="none" stroke="#c9a227" stroke-width="3"/>
  <!-- snow cap on dome -->
  <path d="M600 165 Q660 145 720 165 Q700 190 660 195 Q620 190 600 165 Z" fill="#f7f5f0"/>
</g>

<!-- courtyard steps -->
<rect x="580" y="410" width="140" height="10" fill="#e4ded2"/>
<rect x="590" y="420" width="120" height="10" fill="#eeeae1"/>

<!-- ============ people arriving on foot ============ -->
<g transform="translate(400,410)">
  <ellipse cx="20" cy="82" rx="60" ry="6" fill="#1b3a55" opacity="0.15"/>
  <g>
    <path d="M-13 34 Q-16 -4 0 -10 Q16 -4 13 34 Z" fill="#1b3a55"/>
    <circle cx="0" cy="-20" r="11" fill="#b07b4d"/>
    <rect x="-11" y="30" width="9" height="26" fill="#0b1d2e"/>
    <rect x="2" y="30" width="9" height="26" fill="#0b1d2e"/>
  </g>
  <g transform="translate(36,4)">
    <path d="M-14 44 Q-18 -8 0 -18 Q18 -8 14 44 Z" fill="#1f8a8a"/>
    <path d="M-13 -24 Q0 -38 13 -24 Q12 0 5 12 Q0 16 -5 12 Q-12 0 -13 -24 Z" fill="#e0c163"/>
    <circle cx="0" cy="-20" r="10" fill="#d9a271"/>
    <rect x="-10" y="40" width="9" height="24" fill="#0b1d2e"/>
    <rect x="2" y="40" width="9" height="24" fill="#0b1d2e"/>
  </g>
</g>
<g transform="translate(880,420)">
  <ellipse cx="10" cy="70" rx="45" ry="5" fill="#1b3a55" opacity="0.15"/>
  <g>
    <path d="M-11 28 Q-13 -2 0 -8 Q13 -2 11 28 Z" fill="#3fbf9a"/>
    <circle cx="0" cy="-16" r="9" fill="#8a5a35"/>
    <rect x="-8" y="24" width="7" height="20" fill="#12293e"/>
    <rect x="2" y="24" width="7" height="20" fill="#12293e"/>
  </g>
  <g transform="translate(24,6)">
    <path d="M-10 24 Q-12 -2 0 -7 Q12 -2 10 24 Z" fill="#e8a33d"/>
    <circle cx="0" cy="-14" r="8" fill="#d9a271"/>
    <rect x="-7" y="20" width="6" height="18" fill="#1b3a55"/>
    <rect x="2" y="20" width="6" height="18" fill="#1b3a55"/>
  </g>
</g>

<!-- soft snow drifts along the ground -->
<g fill="#f7f5f0">
  <ellipse cx="150" cy="418" rx="90" ry="10"/>
  <ellipse cx="960" cy="422" rx="110" ry="12"/>
  <ellipse cx="470" cy="424" rx="60" ry="8"/>
  <ellipse cx="830" cy="424" rx="50" ry="7"/>
</g>
</svg>
