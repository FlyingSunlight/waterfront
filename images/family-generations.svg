<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-label="A family kitchen on a winter evening: a grandmother and grandchild rolling dough, a father playing with a toddler on the floor, a teenage girl doing homework at the counter, and snow visible through the window." >
<title>A family kitchen, winter evening</title>
<defs>
  <linearGradient id="nightWindow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0b1d2e"/>
    <stop offset="100%" stop-color="#1b3a55"/>
  </linearGradient>
  <radialGradient id="kitchenWarmth" cx="0.4" cy="0.35" r="0.7">
    <stop offset="0%" stop-color="#e8a33d" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#e8a33d" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x="0" y="0" width="1100" height="520" fill="#eeeae1"/>
<rect x="0" y="0" width="1100" height="520" fill="url(#kitchenWarmth)"/>

<!-- back wall with cabinets -->
<rect x="0" y="30" width="1100" height="200" fill="#e4ded2"/>
<rect x="0" y="222" width="1100" height="10" fill="#c9a227" opacity="0.6"/>

<!-- window with snow falling outside -->
<g>
  <rect x="60" y="50" width="220" height="150" rx="6" fill="url(#nightWindow)"/>
  <rect x="60" y="50" width="220" height="150" rx="6" fill="none" stroke="#f7f5f0" stroke-width="6"/>
  <line x1="170" y1="50" x2="170" y2="200" stroke="#f7f5f0" stroke-width="5"/>
  <line x1="60" y1="125" x2="280" y2="125" stroke="#f7f5f0" stroke-width="5"/>
  <g fill="#f7f5f0" opacity="0.85">
    <circle cx="90" cy="80" r="3"/><circle cx="120" cy="100" r="2.4"/><circle cx="150" cy="70" r="2.8"/>
    <circle cx="200" cy="90" r="3"/><circle cx="230" cy="110" r="2.4"/><circle cx="255" cy="75" r="2.8"/>
    <circle cx="100" cy="150" r="2.6"/><circle cx="140" cy="165" r="3"/><circle cx="190" cy="145" r="2.4"/>
    <circle cx="240" cy="160" r="2.8"/><circle cx="75" cy="115" r="2.2"/>
  </g>
  <!-- distant rooftops with snow -->
  <path d="M60 195 L100 165 L140 195 Z" fill="#12293e"/>
  <path d="M150 195 L190 170 L230 195 Z" fill="#12293e"/>
  <path d="M60 200 L280 200 L280 190 L60 190 Z" fill="#f7f5f0" opacity="0.9"/>
</g>

<!-- upper cabinets -->
<g>
  <rect x="330" y="50" width="120" height="90" rx="4" fill="#1b3a55"/>
  <rect x="460" y="50" width="120" height="90" rx="4" fill="#12293e"/>
  <rect x="590" y="50" width="120" height="90" rx="4" fill="#1b3a55"/>
  <circle cx="440" cy="95" r="4" fill="#c9a227"/>
  <circle cx="570" cy="95" r="4" fill="#c9a227"/>
  <circle cx="700" cy="95" r="4" fill="#c9a227"/>
</g>

<!-- hanging pendant lamp -->
<line x1="820" y1="0" x2="820" y2="70" stroke="#c9a227" stroke-width="2"/>
<path d="M800 70 Q820 55 840 70 L834 100 Q820 110 806 100 Z" fill="#e0c163"/>
<ellipse cx="820" cy="105" rx="70" ry="30" fill="url(#kitchenWarmth)"/>

<!-- kitchen counter, right, with teenage girl doing homework -->
<g>
  <rect x="760" y="230" width="300" height="20" fill="#1b3a55"/>
  <rect x="760" y="250" width="300" height="140" fill="#eeeae1"/>
  <rect x="770" y="270" width="60" height="50" fill="#12293e"/>
  <rect x="850" y="270" width="60" height="50" fill="#12293e"/>
  <rect x="930" y="270" width="60" height="50" fill="#12293e"/>

  <g transform="translate(940,150)">
    <path d="M-16 78 Q-20 8 0 -6 Q20 8 16 78 Z" fill="#3fbf9a"/>
    <circle cx="0" cy="-22" r="13" fill="#b07b4d"/>
    <path d="M0 -34 Q12 -20 6 8" stroke="#0b1d2e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-14" y="74" width="12" height="16" fill="#1b3a55"/>
    <rect x="2" y="74" width="12" height="16" fill="#1b3a55"/>
  </g>
  <rect x="900" y="220" width="60" height="10" fill="#e4ded2"/>
  <rect x="905" y="205" width="34" height="24" rx="2" fill="#1b3a55" opacity="0.85"/>
  <rect x="946" y="212" width="16" height="18" rx="2" fill="#c9a227" opacity="0.8"/>
</g>

<!-- main table: grandmother and grandchild rolling dough -->
<g>
  <ellipse cx="330" cy="392" rx="190" ry="14" fill="#1b3a55" opacity="0.12"/>
  <rect x="160" y="330" width="340" height="18" fill="#c9a227" opacity="0.7"/>
  <rect x="180" y="348" width="14" height="50" fill="#b07b4d"/>
  <rect x="460" y="348" width="14" height="50" fill="#b07b4d"/>
  <ellipse cx="260" cy="326" rx="46" ry="10" fill="#eeeae1"/>
  <circle cx="240" cy="322" r="6" fill="#e0c163"/>
  <circle cx="260" cy="320" r="6" fill="#e0c163"/>
  <circle cx="280" cy="322" r="6" fill="#e0c163"/>
  <rect x="330" y="316" width="60" height="10" rx="4" fill="#f7f5f0"/>

  <!-- grandmother -->
  <g transform="translate(220,270)">
    <path d="M-16 56 Q-20 -6 0 -18 Q20 -6 16 56 Z" fill="#e4ded2"/>
    <path d="M-15 -22 Q0 -36 15 -22 Q14 4 6 16 Q0 20 -6 16 Q-14 4 -15 -22 Z" fill="#1f8a8a"/>
    <circle cx="0" cy="-18" r="12" fill="#b07b4d"/>
    <rect x="-14" y="52" width="12" height="18" fill="#12293e"/>
    <rect x="2" y="52" width="12" height="18" fill="#12293e"/>
    <path d="M-10 20 L-30 40" stroke="#e4ded2" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- grandchild -->
  <g transform="translate(320,300)">
    <path d="M-11 40 Q-13 -2 0 -8 Q13 -2 11 40 Z" fill="#e8a33d"/>
    <circle cx="0" cy="-16" r="9" fill="#d9a271"/>
    <rect x="-9" y="36" width="8" height="14" fill="#1b3a55"/>
    <rect x="2" y="36" width="8" height="14" fill="#1b3a55"/>
    <path d="M-8 6 L-22 22" stroke="#e8a33d" stroke-width="7" stroke-linecap="round"/>
  </g>
</g>

<!-- floor -->
<rect x="0" y="400" width="1100" height="120" fill="#e4ded2"/>
<rect x="0" y="398" width="1100" height="6" fill="#e4ded2"/>
<g stroke="#eeeae1" stroke-width="1" opacity="0.6">
  <line x1="0" y1="430" x2="1100" y2="430"/>
  <line x1="0" y1="465" x2="1100" y2="465"/>
  <line x1="0" y1="500" x2="1100" y2="500"/>
</g>

<!-- father on the floor with toddler -->
<g transform="translate(560,420)">
  <ellipse cx="30" cy="70" rx="120" ry="14" fill="#1b3a55" opacity="0.1"/>
  <!-- father seated cross-legged -->
  <path d="M-60 40 Q-40 10 0 12 Q40 10 60 40 Q30 62 -30 62 Q-50 55 -60 40 Z" fill="#1b3a55"/>
  <circle cx="-8" cy="-6" r="14" fill="#8a5a35"/>
  <path d="M-8 -18 Q4 -30 16 -18" stroke="#0b1d2e" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M-20 20 L-50 34" stroke="#1b3a55" stroke-width="10" stroke-linecap="round"/>
  <!-- toddler -->
  <g transform="translate(48,20)">
    <path d="M-14 34 Q-16 0 0 -6 Q16 0 14 34 Z" fill="#3fbf9a"/>
    <circle cx="0" cy="-16" r="11" fill="#d9a271"/>
    <path d="M-18 14 L-32 4" stroke="#3fbf9a" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- small toy blocks -->
  <rect x="-90" y="52" width="16" height="16" fill="#c9a227" transform="rotate(8 -90 52)"/>
  <rect x="-70" y="58" width="14" height="14" fill="#ba0c2f" opacity="0.7" transform="rotate(-6 -70 58)"/>
</g>

<!-- tea glasses on a small side table -->
<g transform="translate(70,380)">
  <rect x="-10" y="30" width="90" height="8" fill="#b07b4d"/>
  <rect x="-4" y="34" width="10" height="20" fill="#8a5a35"/>
  <rect x="66" y="34" width="10" height="20" fill="#8a5a35"/>
  <path d="M6 0 L20 0 L18 26 L8 26 Z" fill="#e8a33d" opacity="0.85"/>
  <path d="M30 0 L44 0 L42 26 L32 26 Z" fill="#e8a33d" opacity="0.85"/>
  <rect x="4" y="-4" width="18" height="5" fill="#c9a227"/>
  <rect x="28" y="-4" width="18" height="5" fill="#c9a227"/>
</g>

<!-- geometric motif border along counter kickboard -->
<g fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.35">
  <path d="M770 396 L785 384 L800 396 L785 408 Z"/>
  <path d="M800 396 L815 384 L830 396 L815 408 Z"/>
  <path d="M830 396 L845 384 L860 396 L845 408 Z"/>
</g>
</svg>
