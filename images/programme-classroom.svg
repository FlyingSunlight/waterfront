<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Adult students of many backgrounds sit together in a bright Norwegian-language classroom while a teacher points at simple marks on a whiteboard, with bare birch trees visible through tall winter windows.">
<title>Introduksjonsprogrammet: an adult language classroom</title>
<defs>
<linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eeeae1"/>
<stop offset="1" stop-color="#e4ded2"/>
</linearGradient>
<radialGradient id="glow1" cx="0.5" cy="0.15" r="0.85">
