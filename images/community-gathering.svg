<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="An Eid gathering in a community hall: long tables of shared food, children running, and adults of several origins greeting one another under strings of brass lights.">
<title>An Eid gathering</title>
<defs>
  <linearGradient id="hallGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#12293e"/>
    <stop offset="100%" stop-color="#1b3a55"/>
  </linearGradient>
  <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#e0c163" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#e0c163" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x="0" y="0" width="1200" height="300" fill="url(#hallGlow)"/>
<rect x="0" y="300" width="1200" height="220" fill="#e4ded2"/>
<rect x="0" y="295" width="1200" height="8" fill="#eeeae1"/>

<!-- back wall geometric ornament frieze -->
<g fill="none" stroke="#c9a227" stroke-width="1.6" opacity="0.35">
  <path d="M40 60 L64 36 L88 60 L64 84 Z"/>
  <path d="M88 60 L112 36 L136 60 L112 84 Z"/>
  <path d="M136 60 L160 36 L184 60 L160 84 Z"/>
  <path d="M960 60 L984 36 L1008 60 L984 84 Z"/>
  <path d="M1008 60 L1032 36 L1056 60 L1032 84 Z"/>
  <path d="M1056 60 L1080 36 L1104 60 L1080 84 Z"/>
</g>

<!-- string lights swagging across -->
<path d="M0 40 Q 150 100 300 45 Q 450 100 600 45 Q 750 100 900 45 Q 1050 100 1200 40" fill="none" stroke="#c9a227" stroke-width="2" opacity="0.8"/>
<g fill="#e0c163">
  <circle cx="60" cy="60" r="6"/><circle cx="150" cy="88" r="6"/><circle cx="240" cy="60" r="6"/>
  <circle cx="300" cy="46" r="6"/><circle cx="390" cy="88" r="6"/><circle cx="480" cy="60" r="6"/>
  <circle cx="600" cy="46" r="6"/><circle cx="690" cy="88" r="6"/><circle cx="780" cy="60" r="6"/>
  <circle cx="900" cy="46" r="6"/><circle cx="990" cy="88" r="6"/><circle cx="1080" cy="60" r="6"/>
  <circle cx="1140" cy="48" r="6"/>
</g>
<g fill="url(#lampGlow)">
  <circle cx="150" cy="88" r="26"/><circle cx="390" cy="88" r="26"/>
  <circle cx="690" cy="88" r="26"/><circle cx="990" cy="88" r="26"/>
</g>

<!-- long tables with shared food, perspective row -->
<g>
  <rect x="60" y="330" width="1080" height="16" fill="#eeeae1"/>
  <rect x="60" y="346" width="1080" height="8" fill="#e4ded2"/>
  <rect x="90" y="354" width="14" height="60" fill="#c9a227" opacity="0.6"/>
  <rect x="1100" y="354" width="14" height="60" fill="#c9a227" opacity="0.6"/>
  <rect x="560" y="354" width="14" height="60" fill="#c9a227" opacity="0.6"/>

  <!-- dishes -->
  <g>
    <ellipse cx="140" cy="326" rx="30" ry="9" fill="#e8a33d"/>
    <ellipse cx="140" cy="323" rx="24" ry="6" fill="#c9a227"/>
    <ellipse cx="210" cy="328" rx="26" ry="8" fill="#3fbf9a"/>
    <ellipse cx="280" cy="326" rx="28" ry="8" fill="#ba0c2f" opacity="0.7"/>
    <ellipse cx="350" cy="328" rx="24" ry="7" fill="#e0c163"/>
    <ellipse cx="430" cy="326" rx="30" ry="9" fill="#e8a33d"/>
    <ellipse cx="500" cy="328" rx="22" ry="6" fill="#4fb8b8"/>
    <ellipse cx="650" cy="326" rx="26" ry="8" fill="#c9a227"/>
    <ellipse cx="720" cy="328" rx="28" ry="8" fill="#3fbf9a"/>
    <ellipse cx="800" cy="326" rx="24" ry="7" fill="#ba0c2f" opacity="0.65"/>
    <ellipse cx="870" cy="328" rx="30" ry="9" fill="#e8a33d"/>
    <ellipse cx="950" cy="326" rx="24" ry="7" fill="#e0c163"/>
    <ellipse cx="1020" cy="328" rx="26" ry="8" fill="#4fb8b8"/>
    <ellipse cx="1080" cy="326" rx="22" ry="6" fill="#c9a227"/>
    <!-- teapots -->
    <g transform="translate(600,312)">
      <path d="M-10 14 Q-12 -2 0 -4 Q12 -2 10 14 Z" fill="#c9a227"/>
      <path d="M10 4 L20 8 L10 10 Z" fill="#c9a227"/>
    </g>
    <g transform="translate(1000,312)">
      <path d="M-10 14 Q-12 -2 0 -4 Q12 -2 10 14 Z" fill="#e0c163"/>
      <path d="M10 4 L20 8 L10 10 Z" fill="#e0c163"/>
    </g>
  </g>
</g>

<!-- adults greeting, mixed dress, in front of tables -->
<g>
  <!-- pair 1: shalwar kameez + norwegian coat handshake -->
  <g transform="translate(120,400)">
    <ellipse cx="20" cy="98" rx="55" ry="7" fill="#1b3a55" opacity="0.15"/>
    <g>
      <path d="M-16 46 Q-19 -10 0 -18 Q19 -10 16 46 Z" fill="#3fbf9a"/>
      <circle cx="0" cy="-28" r="13" fill="#b07b4d"/>
      <rect x="-14" y="42" width="12" height="30" fill="#e4ded2"/>
      <rect x="2" y="42" width="12" height="30" fill="#e4ded2"/>
      <path d="M14 4 L34 -6" stroke="#3fbf9a" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g transform="translate(50,4)">
      <path d="M-15 42 Q-18 -8 0 -16 Q18 -8 15 42 Z" fill="#1b3a55"/>
      <circle cx="0" cy="-26" r="13" fill="#8a5a35"/>
      <rect x="-13" y="38" width="11" height="28" fill="#0b1d2e"/>
      <rect x="2" y="38" width="11" height="28" fill="#0b1d2e"/>
      <path d="M-14 0 L-32 -8" stroke="#1b3a55" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- pair 2: woman in hijab + man in thobe -->
  <g transform="translate(340,410)">
    <ellipse cx="16" cy="90" rx="50" ry="6" fill="#1b3a55" opacity="0.15"/>
    <g>
      <path d="M-15 44 Q-19 -8 0 -18 Q19 -8 15 44 Z" fill="#e0c163"/>
      <path d="M-14 -24 Q0 -38 14 -24 Q13 0 6 12 Q0 16 -6 12 Q-13 0 -14 -24 Z" fill="#ba0c2f" opacity="0.75"/>
      <circle cx="0" cy="-20" r="11" fill="#d9a271"/>
      <rect x="-12" y="40" width="10" height="26" fill="#12293e"/>
      <rect x="2" y="40" width="10" height="26" fill="#12293e"/>
    </g>
    <g transform="translate(44,-6)">
      <path d="M-14 56 Q-18 -8 0 -20 Q18 -8 14 56 Z" fill="#f7f5f0"/>
      <circle cx="0" cy="-30" r="12" fill="#8a5a35"/>
      <rect x="-9" y="-38" width="18" height="10" rx="4" fill="#eeeae1"/>
    </g>
  </g>

  <!-- pair 3: two women chatting -->
  <g transform="translate(880,405)">
    <ellipse cx="14" cy="94" rx="50" ry="6" fill="#1b3a55" opacity="0.15"/>
    <g>
      <path d="M-15 46 Q-19 -8 0 -18 Q19 -8 15 46 Z" fill="#1f8a8a"/>
      <path d="M-14 -24 Q0 -38 14 -24 Q13 0 6 12 Q0 16 -6 12 Q-13 0 -14 -24 Z" fill="#eeeae1"/>
      <circle cx="0" cy="-20" r="11" fill="#b07b4d"/>
      <rect x="-12" y="42" width="10" height="28" fill="#0b1d2e"/>
      <rect x="2" y="42" width="10" height="28" fill="#0b1d2e"/>
    </g>
    <g transform="translate(42,6)">
      <path d="M-14 40 Q-17 -6 0 -14 Q17 -6 14 40 Z" fill="#c9a227"/>
      <circle cx="0" cy="-24" r="11" fill="#d9a271"/>
      <path d="M0 -34 Q10 -22 5 4" stroke="#0b1d2e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="-11" y="36" width="9" height="24" fill="#1b3a55"/>
      <rect x="2" y="36" width="9" height="24" fill="#1b3a55"/>
    </g>
  </g>

  <!-- pair 4: norwegian winter coats -->
  <g transform="translate(1030,398)">
    <ellipse cx="10" cy="98" rx="46" ry="6" fill="#1b3a55" opacity="0.15"/>
    <g>
      <path d="M-15 48 Q-19 -6 0 -16 Q19 -6 15 48 Z" fill="#1b3a55"/>
      <circle cx="0" cy="-28" r="12" fill="#8a5a35"/>
      <rect x="-13" y="44" width="11" height="28" fill="#0b1d2e"/>
      <rect x="2" y="44" width="11" height="28" fill="#0b1d2e"/>
    </g>
    <g transform="translate(38,6)">
      <path d="M-14 40 Q-17 -6 0 -14 Q17 -6 14 40 Z" fill="#4fb8b8"/>
      <circle cx="0" cy="-24" r="11" fill="#d9a271"/>
      <rect x="-11" y="36" width="9" height="24" fill="#12293e"/>
      <rect x="2" y="36" width="9" height="24" fill="#12293e"/>
    </g>
  </g>
</g>

<!-- children running in foreground -->
<g>
  <g transform="translate(220,470) scale(0.9)">
    <path d="M-10 26 Q-12 -2 0 -8 Q12 -2 10 26 Z" fill="#e8a33d"/>
    <circle cx="0" cy="-16" r="9" fill="#d9a271"/>
    <path d="M-9 22 L-22 32" stroke="#e8a33d" stroke-width="7" stroke-linecap="round"/>
    <path d="M9 22 L22 12" stroke="#e8a33d" stroke-width="7" stroke-linecap="round"/>
    <rect x="-8" y="24" width="7" height="18" fill="#1b3a55" transform="rotate(18 -8 24)"/>
    <rect x="1" y="24" width="7" height="18" fill="#1b3a55" transform="rotate(-14 1 24)"/>
  </g>
  <g transform="translate(700,478) scale(0.95)">
    <path d="M-10 24 Q-12 -2 0 -8 Q12 -2 10 24 Z" fill="#3fbf9a"/>
    <circle cx="0" cy="-16" r="9" fill="#b07b4d"/>
    <path d="M-9 20 L-24 14" stroke="#3fbf9a" stroke-width="7" stroke-linecap="round"/>
    <path d="M9 20 L20 32" stroke="#3fbf9a" stroke-width="7" stroke-linecap="round"/>
    <rect x="-8" y="22" width="7" height="17" fill="#12293e" transform="rotate(-16 -8 22)"/>
    <rect x="1" y="22" width="7" height="17" fill="#12293e" transform="rotate(20 1 22)"/>
  </g>
  <g transform="translate(960,472) scale(0.85)">
    <path d="M-14 -26 Q0 -38 14 -26 Q13 -6 6 4 Q0 8 -6 4 Q-13 -6 -14 -26 Z" fill="#e0c163"/>
    <path d="M-9 24 Q-11 -2 0 -8 Q11 -2 9 24 Z" fill="#ba0c2f" opacity="0.7"/>
    <circle cx="0" cy="-18" r="8" fill="#d9a271"/>
    <path d="M-8 20 L-22 26" stroke="#ba0c2f" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M8 20 L22 12" stroke="#ba0c2f" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>
</g>

<!-- floor ornament strip -->
<g fill="none" stroke="#c9a227" stroke-width="1.4" opacity="0.3">
  <path d="M50 500 L70 480 L90 500 L70 520 Z"/>
  <path d="M90 500 L110 480 L130 500 L110 520 Z"/>
  <path d="M1070 500 L1090 480 L1110 500 L1090 520 Z"/>
  <path d="M1110 500 L1130 480 L1150 500 L1130 520 Z"/>
</g>
</svg>
