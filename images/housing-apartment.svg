<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="A Norwegian apartment block on a winter evening, its brass-lit windows each showing a small vignette of home life: cooking, a child at a desk, a person praying, a family eating, someone watering plants. Snow sits on the balconies, with a bike rack and a street lamp below.">
<title>Housing: an inhabited winter evening</title>
<defs>
<linearGradient id="eveSky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0b1d2e"/>
<stop offset="1" stop-color="#1b3a55"/>
</linearGradient>
<radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#e0c163" stop-opacity="0.55"/>
<stop offset="1" stop-color="#e0c163" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="1200" height="560" fill="url(#eveSky)"/>
<!-- stars -->
<g fill="#f7f5f0" opacity="0.7">
<circle cx="80" cy="60" r="2"/>
<circle cx="150" cy="40" r="1.6"/>
<circle cx="1080" cy="70" r="2"/>
<circle cx="1140" cy="45" r="1.6"/>
<circle cx="1000" cy="30" r="1.4"/>
</g>

<!-- snowy ground -->
<rect x="0" y="500" width="1200" height="60" fill="#eeeae1"/>
<path d="M0 500 Q300 486 600 498 Q900 510 1200 494 L1200 512 L0 512Z" fill="#f7f5f0"/>

<!-- building -->
<rect x="130" y="70" width="940" height="430" fill="#12293e"/>
<rect x="130" y="58" width="940" height="16" fill="#0b1d2e"/>
<!-- snowy roofline -->
<rect x="130" y="58" width="940" height="8" fill="#f7f5f0"/>

<!-- balcony ledges with snow, one per floor -->
<g fill="#1b3a55">
<rect x="130" y="188" width="940" height="10"/>
<rect x="130" y="298" width="940" height="10"/>
<rect x="130" y="408" width="940" height="10"/>
</g>
<g fill="#f7f5f0" opacity="0.9">
<rect x="130" y="188" width="940" height="4"/>
<rect x="130" y="298" width="940" height="4"/>
<rect x="130" y="408" width="940" height="4"/>
</g>

<!-- window helper vignettes, 5 columns x 4 rows -->
<!-- Row 1 y~110-190 -->
<g>
<!-- col1: cooking -->
<g transform="translate(210,150)">
<rect x="-58" y="-42" width="116" height="84" rx="6" fill="#e0c163"/>
<rect x="-40" y="20" width="80" height="10" fill="#1b3a55"/>
<circle cx="-10" cy="8" r="14" fill="#12293e"/>
<path d="M-10 -6 Q-2 -14 6 -6" stroke="#e8a33d" stroke-width="3" fill="none"/>
<circle cx="24" cy="-4" r="16" fill="#b07b4d"/>
</g>
<!-- col2: child at desk -->
<g transform="translate(370,150)">
<rect x="-58" y="-42" width="116" height="84" rx="6" fill="#e0c163"/>
<rect x="-40" y="10" width="80" height="8" fill="#12293e"/>
<circle cx="0" cy="-8" r="16" fill="#f0c8a0"/>
<rect x="-16" y="10" width="32" height="6" fill="#3fbf9a"/>
</g>
<!-- col3: praying -->
<g transform="translate(530,150)">
<rect x="-58" y="-42" width="116" height="84" rx="6" fill="#e0c163"/>
<rect x="-30" y="18" width="60" height="8" fill="#1f8a8a"/>
<circle cx="0" cy="0" r="14" fill="#8a5a35"/>
<path d="M-16 12 Q0 -2 16 12 Q16 20 0 22 Q-16 20 -16 12Z" fill="#12293e"/>
</g>
<!-- col4: family eating -->
<g transform="translate(690,150)">
<rect x="-58" y="-42" width="116" height="84" rx="6" fill="#e0c163"/>
<rect x="-34" y="6" width="68" height="8" fill="#1b3a55"/>
<circle cx="-16" cy="-8" r="13" fill="#d9a271"/>
<circle cx="16" cy="-8" r="13" fill="#f0c8a0"/>
<circle cx="0" cy="-16" r="10" fill="#b07b4d"/>
</g>
<!-- col5: watering plants -->
<g transform="translate(850,150)">
<rect x="-58" y="-42" width="116" height="84" rx="6" fill="#e0c163"/>
<circle cx="10" cy="-6" r="15" fill="#8a5a35"/>
<path d="M-30 22 Q-32 4 -18 -4 Q-4 4 -6 22Z" fill="#1f8f74"/>
<circle cx="-18" cy="-6" r="6" fill="#3fbf9a"/>
</g>
</g>

<!-- Row 2 y~200-280 plain glow + a couple vignettes -->
<g>
<rect x="152" y="220" width="116" height="80" rx="6" fill="#e0c163"/>
<g transform="translate(370,260)">
<rect x="-58" y="-40" width="116" height="80" rx="6" fill="#e0c163"/>
<circle cx="0" cy="-10" r="16" fill="#b07b4d"/>
<rect x="-18" y="8" width="36" height="8" fill="#3fbf9a"/>
</g>
<rect x="472" y="220" width="116" height="80" rx="6" fill="#c9a227" opacity="0.9"/>
<g transform="translate(690,260)">
<rect x="-58" y="-40" width="116" height="80" rx="6" fill="#e0c163"/>
<circle cx="-14" cy="-8" r="12" fill="#f0c8a0"/>
<circle cx="14" cy="-8" r="12" fill="#8a5a35"/>
<rect x="-30" y="10" width="60" height="6" fill="#1b3a55"/>
</g>
<rect x="792" y="220" width="116" height="80" rx="6" fill="#e0c163"/>
<g transform="translate(1010,260)">
<rect x="-58" y="-40" width="116" height="80" rx="6" fill="#e0c163"/>
<circle cx="0" cy="-12" r="15" fill="#d9a271"/>
<path d="M-16 6 Q0 -6 16 6 Q16 16 0 18 Q-16 16 -16 6Z" fill="#0b1d2e"/>
</g>
</g>

<!-- Row 3 y~310-390 -->
<g>
<g transform="translate(210,350)">
<rect x="-58" y="-40" width="116" height="80" rx="6" fill="#e0c163"/>
<circle cx="-8" cy="-6" r="14" fill="#12293e"/>
<circle cx="20" cy="-2" r="16" fill="#d9a271"/>
</g>
<rect x="312" y="310" width="116" height="80" rx="6" fill="#e0c163"/>
<g transform="translate(530,350)">
<rect x="-58" y="-40" width="116" height="80" rx="6" fill="#e0c163"/>
<circle cx="0" cy="-8" r="15" fill="#f0c8a0"/>
<rect x="-18" y="10" width="36" height="8" fill="#3fbf9a"/>
</g>
<rect x="632" y="310" width="116" height="80" rx="6" fill="#e0c163" opacity="0.85"/>
<g transform="translate(850,350)">
<rect x="-58" y="-40" width="116" height="80" rx="6" fill="#e0c163"/>
<circle cx="-14" cy="-6" r="12" fill="#8a5a35"/>
<circle cx="14" cy="-6" r="12" fill="#b07b4d"/>
<rect x="-28" y="12" width="56" height="6" fill="#1b3a55"/>
</g>
<rect x="952" y="310" width="116" height="80" rx="6" fill="#e0c163"/>
</g>

<!-- Row 4 y~420-500 -->
<g>
<rect x="152" y="430" width="116" height="76" rx="6" fill="#e0c163"/>
<g transform="translate(370,468)">
<rect x="-58" y="-38" width="116" height="76" rx="6" fill="#e0c163"/>
<circle cx="8" cy="-6" r="14" fill="#b07b4d"/>
<path d="M-30 18 Q-32 2 -18 -6 Q-4 2 -6 18Z" fill="#1f8f74"/>
</g>
<rect x="472" y="430" width="116" height="76" rx="6" fill="#c9a227" opacity="0.9"/>
<g transform="translate(690,468)">
<rect x="-58" y="-38" width="116" height="76" rx="6" fill="#e0c163"/>
<circle cx="0" cy="-4" r="15" fill="#8a5a35"/>
<path d="M-16 10 Q0 -4 16 10 Q16 18 0 20 Q-16 18 -16 10Z" fill="#12293e"/>
</g>
<rect x="792" y="430" width="116" height="76" rx="6" fill="#e0c163"/>
<g transform="translate(1010,468)">
<rect x="-58" y="-38" width="116" height="76" rx="6" fill="#e0c163"/>
<circle cx="-12" cy="-6" r="12" fill="#f0c8a0"/>
<circle cx="12" cy="-6" r="12" fill="#d9a271"/>
</g>
</g>

<!-- ground floor entrance -->
<rect x="540" y="440" width="120" height="60" rx="4" fill="#0b1d2e"/>
<rect x="552" y="452" width="96" height="48" fill="#1b3a55"/>
<rect x="596" y="452" width="6" height="48" fill="#0b1d2e"/>

<!-- bike rack -->
<g transform="translate(220,500)" stroke="#1b3a55" stroke-width="6" fill="none" stroke-linecap="round">
<rect x="-70" y="-20" width="140" height="18" rx="8" fill="none"/>
<circle cx="-40" cy="4" r="20"/>
<circle cx="0" cy="4" r="20"/>
<circle cx="40" cy="4" r="20"/>
</g>

<!-- street lamp -->
<g transform="translate(1000,500)">
<rect x="-4" y="-140" width="8" height="140" fill="#12293e"/>
<circle cx="0" cy="-150" r="16" fill="#e0c163"/>
<circle cx="0" cy="-150" r="34" fill="url(#lampGlow)"/>
</g>
</svg>
