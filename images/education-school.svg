<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Children of many backgrounds leave a low modern Norwegian primary school at the end of the snowy day, some on kicksleds, backpacks on, while a teacher waves from the doorway. One girl wears a hijab among classmates who do not.">
<title>School: the end of an ordinary snowy day</title>
<defs>
<linearGradient id="skyE" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eeeae1"/>
<stop offset="1" stop-color="#e0c163"/>
</linearGradient>
<radialGradient id="sunE" cx="0.82" cy="0.18" r="0.5">
<stop offset="0" stop-color="#e8a33d" stop-opacity="0.55"/>
<stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="1200" height="540" fill="url(#skyE)"/>
<circle cx="990" cy="110" r="140" fill="url(#sunE)"/>
<circle cx="990" cy="110" r="46" fill="#e8a33d"/>

<!-- distant birch line -->
<g stroke="#1b3a55" stroke-width="4" stroke-linecap="round" opacity="0.5">
<line x1="60" y1="300" x2="55" y2="200"/>
<line x1="120" y1="300" x2="128" y2="190"/>
<line x1="1080" y1="300" x2="1075" y2="195"/>
<line x1="1140" y1="300" x2="1148" y2="205"/>
</g>

<!-- snow ground -->
<rect x="0" y="330" width="1200" height="210" fill="#f7f5f0"/>
<path d="M0 330 Q300 310 600 328 Q900 346 1200 320 L1200 340 L0 340Z" fill="#eeeae1"/>

<!-- school building -->
<rect x="150" y="150" width="900" height="190" fill="#1b3a55"/>
<rect x="150" y="140" width="900" height="20" fill="#12293e"/>
<rect x="150" y="330" width="900" height="10" fill="#0b1d2e"/>
<!-- windows row -->
<g fill="#e0c163">
<rect x="190" y="190" width="80" height="70" rx="4"/>
<rect x="300" y="190" width="80" height="70" rx="4"/>
<rect x="410" y="190" width="80" height="70" rx="4"/>
<rect x="710" y="190" width="80" height="70" rx="4"/>
<rect x="820" y="190" width="80" height="70" rx="4"/>
<rect x="930" y="190" width="80" height="70" rx="4"/>
</g>
<!-- doorway -->
<rect x="540" y="200" width="120" height="140" rx="6" fill="#12293e"/>
<rect x="552" y="212" width="96" height="128" fill="#e0c163"/>
<!-- entry canopy -->
<rect x="510" y="180" width="180" height="16" rx="6" fill="#c9a227"/>

<!-- teacher waving in doorway -->
<g transform="translate(600,300)">
<rect x="-22" y="-6" width="44" height="70" rx="16" fill="#3fbf9a"/>
<circle cx="0" cy="-30" r="23" fill="#8a5a35"/>
<path d="M-20 -38 Q-18 -56 0 -58 Q18 -56 20 -38 Q12 -44 0 -45 Q-12 -44 -20 -38Z" fill="#0b1d2e"/>
<rect x="16" y="-46" width="10" height="34" rx="5" fill="#8a5a35" transform="rotate(150 16 -46)"/>
</g>

<!-- flag pole with norwegian-neutral banner (abstract, not the flag) -->
<rect x="140" y="120" width="6" height="140" fill="#c9a227"/>
<path d="M146 120 L200 132 L146 144Z" fill="#3fbf9a"/>

<!-- snow drifts foreground -->
<path d="M0 470 Q150 440 320 466 Q520 496 760 468 Q980 442 1200 472 L1200 540 L0 540Z" fill="#eeeae1"/>
<path d="M0 500 Q220 480 480 500 Q760 522 1200 496 L1200 540 L0 540Z" fill="#f7f5f0"/>

<!-- children walking out, mixed backgrounds, backpacks -->
<g transform="translate(240,470) scale(1.05)">
<rect x="-22" y="-8" width="44" height="60" rx="16" fill="#ba0c2f"/>
<circle cx="0" cy="-34" r="22" fill="#d9a271"/>
<path d="M-19 -42 Q-17 -56 0 -58 Q17 -56 19 -42 Q12 -47 0 -48 Q-12 -47 -19 -42Z" fill="#12293e"/>
<rect x="-26" y="-4" width="14" height="28" rx="6" fill="#1f8f74"/>
<rect x="-8" y="18" width="12" height="26" rx="5" fill="#12293e"/>
<rect x="8" y="18" width="12" height="26" rx="5" fill="#12293e"/>
</g>

<g transform="translate(330,478) scale(1.05)">
<rect x="-22" y="-8" width="44" height="58" rx="16" fill="#3fbf9a"/>
<circle cx="0" cy="-33" r="22" fill="#f0c8a0"/>
<path d="M-26 -40 Q0 -60 26 -40 Q28 -14 22 4 L-22 4 Q-28 -14 -26 -40Z" fill="#e8a33d"/>
<rect x="20" y="-2" width="14" height="26" rx="6" fill="#c9a227"/>
</g>

<g transform="translate(430,468) scale(1)">
<rect x="-20" y="-8" width="40" height="54" rx="14" fill="#c9a227"/>
<circle cx="0" cy="-30" r="20" fill="#b07b4d"/>
<path d="M-17 -37 Q-15 -50 0 -52 Q15 -50 17 -37 Q10 -42 0 -43 Q-10 -42 -17 -37Z" fill="#0b1d2e"/>
<rect x="-24" y="-2" width="13" height="24" rx="5" fill="#4fb8b8"/>
<rect x="-6" y="16" width="10" height="22" rx="4" fill="#12293e"/>
<rect x="6" y="16" width="10" height="22" rx="4" fill="#12293e"/>
</g>

<!-- child on kicksled -->
<g transform="translate(560,500)">
<path d="M-70 30 L70 30 L60 40 L-60 40Z" fill="#1b3a55"/>
<rect x="-30" y="-10" width="8" height="42" fill="#12293e"/>
<rect x="-46" y="-40" width="60" height="16" rx="6" fill="#12293e"/>
<g transform="translate(-16,-46)">
<rect x="-18" y="-4" width="36" height="46" rx="14" fill="#e8a33d"/>
<circle cx="0" cy="-24" r="18" fill="#d9a271"/>
<path d="M-16 -30 Q-14 -44 0 -46 Q14 -44 16 -30 Q9 -35 0 -36 Q-9 -35 -16 -30Z" fill="#1b3a55"/>
</g>
</g>

<g transform="translate(720,472) scale(1.02)">
<rect x="-21" y="-8" width="42" height="56" rx="15" fill="#4fb8b8"/>
<circle cx="0" cy="-32" r="21" fill="#8a5a35"/>
<path d="M-18 -39 Q-16 -52 0 -54 Q16 -52 18 -39 Q11 -44 0 -45 Q-11 -44 -18 -39Z" fill="#e4ded2"/>
<rect x="16" y="0" width="12" height="26" rx="5" fill="#0b1d2e"/>
</g>

<g transform="translate(830,480) scale(1.05)">
<rect x="-22" y="-8" width="44" height="58" rx="16" fill="#e0c163"/>
<circle cx="0" cy="-33" r="22" fill="#f0c8a0"/>
<path d="M-19 -41 Q-17 -55 0 -57 Q17 -55 19 -41 Q11 -46 0 -47 Q-11 -46 -19 -41Z" fill="#12293e"/>
<rect x="-27" y="-2" width="14" height="26" rx="6" fill="#1f8a8a"/>
</g>

<g transform="translate(940,470) scale(1)">
<rect x="-20" y="-8" width="40" height="54" rx="14" fill="#1f8f74"/>
<circle cx="0" cy="-30" r="20" fill="#b07b4d"/>
<path d="M-17 -37 Q-15 -50 0 -52 Q15 -50 17 -37 Q10 -42 0 -43 Q-10 -42 -17 -37Z" fill="#0b1d2e"/>
<rect x="16" y="-2" width="12" height="24" rx="5" fill="#c9a227"/>
</g>
</svg>
