<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="夜風に髪をなびかせ、三日月を見上げる女性の横顔。胸元のフェザーペンダントが風にゆれている">
  <defs>
    <linearGradient id="opSil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="opHair" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.5" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="opGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c97e"/>
      <stop offset="1" stop-color="#a8823a"/>
    </linearGradient>
    <radialGradient id="opTq" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#7ccfc8"/>
      <stop offset="0.6" stop-color="#3aa8a0"/>
      <stop offset="1" stop-color="#2d8a84"/>
    </radialGradient>
    <radialGradient id="opBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BCEFA" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5BCEFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="opPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A9B8" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#F5A9B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="opSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- faintest aurora at the horizon -->
  <ellipse cx="175" cy="352" rx="230" ry="72" fill="url(#opBlue)"/>
  <ellipse cx="425" cy="352" rx="230" ry="72" fill="url(#opPink)"/>

  <!-- stars -->
  <g fill="#eef1f6">
    <circle cx="62" cy="58" r="1.3" opacity="0.7"/>
    <circle cx="96" cy="152" r="1" opacity="0.5"/>
    <circle cx="230" cy="48" r="1.2" opacity="0.6"/>
    <circle cx="272" cy="112" r="1" opacity="0.5"/>
    <circle cx="420" cy="56" r="1.2" opacity="0.65"/>
    <circle cx="502" cy="106" r="1.4" opacity="0.7"/>
    <circle cx="548" cy="182" r="1" opacity="0.5"/>
    <circle cx="256" cy="84" r="0.9" opacity="0.45"/>
    <circle cx="530" cy="262" r="1" opacity="0.4"/>
  </g>
  <g stroke="#eef1f6" stroke-width="1.1" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M208 132 v10 M203 137 h10"/>
    <path d="M478 66 v9 M473.5 70.5 h9"/>
  </g>

  <!-- crescent moon, opening toward her -->
  <circle cx="140" cy="96" r="50" fill="none" stroke="url(#opSil)" stroke-width="0.8" opacity="0.22"/>
  <path d="M158 56 A44 44 0 1 0 158 136" fill="none" stroke="url(#opSil)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M158 136 A40 40 0 0 1 158 56" fill="none" stroke="url(#opSil)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M111 120 A38 38 0 0 1 111 72" fill="none" stroke="url(#opGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <g fill="none" stroke="url(#opSil)" stroke-width="0.9" stroke-linecap="round" opacity="0.4">
    <path d="M117 82 C114 88 113 95 114 101"/>
    <path d="M122 110 C120 114 119.6 118 120.4 122"/>
  </g>

  <!-- a feather riding the breeze between her and the moon -->
  <path d="M262 158 Q 246 178 238 198" fill="none" stroke="#eef1f6" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.3"/>
  <g transform="translate(236 202) rotate(30) scale(0.38)" fill="none" stroke="url(#opSil)" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">
    <path d="M0 0 C -7 12 -9 28 -5 44 C -3 51 0 56 2 60 C 7 50 10 32 8 16 C 7 8 4 3 0 0 Z" stroke-width="1.8"/>
    <path d="M0 2 C 0 22 1 42 1 58" stroke-width="1.2"/>
  </g>

  <!-- still horizon -->
  <path d="M44 348 H556" stroke="url(#opSil)" stroke-width="1.4" stroke-linecap="round" opacity="0.6" fill="none"/>
  <path d="M76 354 H520" stroke="url(#opSil)" stroke-width="0.7" stroke-linecap="round" opacity="0.2" fill="none"/>
  <!-- moonlight on the water -->
  <g stroke="url(#opSil)" stroke-width="1.1" stroke-linecap="round" opacity="0.3" fill="none">
    <path d="M124 358 H156"/>
    <path d="M130 366 H150"/>
    <path d="M135 374 H145"/>
  </g>

  <!-- ===== the woman, leaning gently into the night ===== -->
  <g transform="rotate(-10 340 260)">
    <!-- skin: ivory tonal fill (face, then neck and chest) -->
    <g filter="url(#opSoft)">
      <path d="M322 130 C317 139 313.5 149 312.6 157 C310.5 163 307.8 169 306.2 173.8
               C306.4 176 308.4 177 311.6 176.9 C311.1 180 310.2 183 310.4 184.6
               C310.6 187 310.8 189 311.6 190.8 C312.2 193 313.2 195.4 314.8 197.6
               C316.8 200.8 320.4 204.2 324.8 206.4 C333 210.6 344 213.6 355 214.2
               C352.5 200 350.5 184 350.3 168 C349.3 160 346 152 342 146
               C337 138 330 132 322 130 Z
               M320 202 C324 206.5 330 210 337 212.4 L355 214.2 L358 218
               C360 230 361.5 240 363 248 C380 255 398 265 412 279
               C429 296 440 320 444 348 C447 372 448 400 447 430 L196 430
               C196 398 200 374 208 356 C214 344 224 334 236 326
               C253 315 273 303 289 289 C302 277 312 262 317 245
               C319.5 234 321.5 222 323.5 210 Z"
            fill="#e8cdb5" fill-opacity="0.3"/>
      <path d="M321 205 C330 210.5 342 213.5 354 214 L356 228 C344 228 331 224 322 218 Z"
            fill="#e8cdb5" fill-opacity="0.12"/>
    </g>

    <!-- hair mass -->
    <path d="M322 130 C326 117 336 110 348 110 C362 109 374 117 380 130
             C386 143 387 160 384 176 C381 192 374 205 364 214 L358 218
             C355 217 355 215.5 355 214.2 C352.5 200 350.5 184 350.3 168
             C349.3 160 346 152 342 146 C337 138 330 132 322 130 Z"
          fill="url(#opHair)" opacity="0.13"/>

    <!-- profile -->
    <g fill="none" stroke="url(#opSil)" stroke-linecap="round" stroke-linejoin="round">
      <!-- forehead, nose -->
      <path d="M322 130 C317 138 313.8 148 312.8 156 C312.4 158.5 311.9 160 311.4 161.5
               C309.2 166 306.8 170.2 305.6 173.4 C305.4 175.2 306.6 176.4 308.9 176.8" stroke-width="2"/>
      <path d="M308.9 176.8 C310.4 177 311.8 176.9 312.8 176.6" stroke-width="1.1" opacity="0.7"/>
      <!-- philtrum, lips, chin -->
      <path d="M312.6 177.2 C312.2 178.6 311.7 180.2 311.4 181.6 C310.4 182.4 310 183.4 310.4 184.4" stroke-width="1.5"/>
      <path d="M310.4 184.4 C310.9 185.4 311.2 186 311 186.6 C310.6 187.6 310.6 189.2 311.4 190.6" stroke-width="1.6"/>
      <path d="M311.4 190.6 C312 191.8 312.4 192.8 312.6 194 C313.4 196.4 314.6 198.4 316.4 199.8" stroke-width="1.8"/>
      <path d="M316.4 199.8 C319.5 202.6 323.5 205 328.5 207 C337 210.4 347 213 355 214" stroke-width="1.6"/>
      <!-- mouth, gently smiling -->
      <path d="M310.8 186.5 C313.6 187.3 316.6 187.1 319 185.9" stroke-width="1.05"/>
      <path d="M310.6 183.2 C313 182.6 315.8 182.8 318 183.8" stroke-width="0.7" opacity="0.5"/>
      <path d="M311.4 189.8 C313.6 190.5 316.2 190.3 318.4 189.1" stroke-width="0.65" opacity="0.45"/>
      <!-- brow -->
      <path d="M312.6 152.6 C316.5 150 321.5 149.4 325.8 150.6" stroke-width="1.7"/>
      <!-- eye, lifted to the moon -->
      <ellipse cx="318.8" cy="160.4" rx="1.8" ry="2.4" fill="#17171c" fill-opacity="0.55" stroke-width="0.7"/>
      <circle cx="318.2" cy="159.4" r="0.55" fill="#eef1f6" stroke="none"/>
      <path d="M314.6 159.8 C317.8 157.6 321.6 157.2 324.8 158.4" stroke-width="1.5"/>
      <path d="M314.6 159.8 L312.6 160.6" stroke-width="1"/>
      <path d="M315.8 163 C318.4 164.1 321.4 164.1 323.8 163" stroke-width="0.7" opacity="0.45"/>
      <path d="M315 157 C318 155.2 321.6 154.9 324.6 155.9" stroke-width="0.5" opacity="0.3"/>
      <!-- the years, worn kindly -->
      <path d="M325.8 159.8 L329 159.2" stroke-width="0.45" opacity="0.32"/>
      <path d="M325.6 161.8 L328.8 162.4" stroke-width="0.45" opacity="0.28"/>
      <path d="M316 166 C318.8 167.1 321.6 166.9 324 165.8" stroke-width="0.45" opacity="0.26"/>
      <path d="M315.5 142 C319 140.6 323 140.4 326.5 141.4" stroke-width="0.45" opacity="0.24"/>
      <path d="M312.4 178 C316 180.4 319 183.2 320.8 186.6" stroke-width="0.45" opacity="0.26"/>
      <!-- hairline -->
      <path d="M322 130 C330 132 337 138 342 146 C346 152 349 158 350 163" stroke-width="0.9" opacity="0.5"/>
      <!-- ear and a small gold drop -->
      <path d="M347 165 C352.5 163 356 167 355 173 C354.2 178 351 182 347 183" stroke-width="1.3"/>
      <path d="M349.5 169 C351.8 169.5 352.6 172 351.6 175" stroke-width="0.8" opacity="0.6"/>
      <path d="M346.8 183.5 L346.5 186.4" stroke="#c9a24b" stroke-width="0.9"/>
      <circle cx="346.4" cy="188.4" r="1.8" fill="url(#opGold)" stroke="none" opacity="0.95"/>
    </g>

    <!-- neck and shoulders -->
    <g fill="none" stroke="url(#opSil)" stroke-linecap="round">
      <path d="M323.5 208 C322 220 320.5 232 318 243 C313 260 303 275 289 287 C273 301 253 313 236 324 C224 332 214 343 208 356 C200 374 196 398 196 430" stroke-width="1.8"/>
      <path d="M358 218 C360 231 361.5 241 363 248 C380 255 398 265 412 279 C429 296 440 320 444 348 C447 372 448 400 447 430" stroke-width="1.8"/>
      <path d="M323 249 C333 255 347 257.5 359 255" stroke-width="1.1" opacity="0.55"/>
    </g>

    <!-- hair streaming in the night breeze, silver threads among it -->
    <g fill="none" stroke="url(#opHair)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M322 130 C326 117 336 110 348 110 C362 109 374 117 380 130 C386 143 387 160 384 176 C381 192 374 205 364 214" stroke-width="2.2"/>
      <path d="M340 114 C372 106 410 112 444 128 C474 141 502 161 524 184" stroke-width="2.2"/>
      <path d="M366 120 C398 118 432 130 460 148 C480 161 498 178 510 194" stroke-width="1.5" opacity="0.75"/>
      <path d="M382 146 C410 148 438 160 460 176 C476 188 490 203 498 216" stroke-width="1.3" opacity="0.6"/>
      <path d="M385 170 C408 176 430 188 448 204 C459 214 468 226 473 236" stroke-width="1.1" opacity="0.5"/>
      <path d="M372 206 C390 216 406 230 418 246" stroke-width="0.9" opacity="0.4"/>
      <path d="M328 124 C333 118 340 114 348 113" stroke-width="0.8" opacity="0.5"/>
    </g>
    <g fill="none" stroke="#eef1f6" stroke-linecap="round" opacity="0.65">
      <path d="M344 118 C374 112 408 118 438 132 C464 144 488 162 506 180" stroke-width="0.7"/>
      <path d="M384 156 C410 160 434 171 454 186" stroke-width="0.55"/>
      <path d="M376 132 C404 132 432 142 456 158" stroke-width="0.5" opacity="0.8"/>
    </g>

    <!-- dress neckline -->
    <path d="M292 300 C318 306 348 306 374 296" fill="none" stroke="url(#opSil)" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M296 306 C320 311 346 311 370 302" fill="none" stroke="url(#opSil)" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
    <path d="M292 300 C318 306 348 306 374 296 C390 305 406 320 416 340 C428 362 434 394 434 430 L214 430 C214 400 218 376 226 358 C236 336 252 320 268 310 Z"
          fill="url(#opSil)" opacity="0.05"/>
    <g fill="none" stroke="url(#opSil)" stroke-linecap="round" opacity="0.28">
      <path d="M262 330 C260 360 258 396 258 428" stroke-width="0.8"/>
      <path d="M320 334 C320 364 320 398 320 428" stroke-width="0.8"/>
      <path d="M376 328 C379 360 381 396 381 426" stroke-width="0.8"/>
    </g>

    <!-- feather pendant, lifted by the wind -->
    <path d="M356 221 C348 237 339 249 329.5 255" fill="none" stroke="url(#opSil)"
          stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 6"/>
    <circle cx="334" cy="249.5" r="2.2" fill="url(#opTq)"/>
    <circle cx="328.5" cy="258" r="2.6" fill="none" stroke="url(#opSil)" stroke-width="1.2"/>
    <g transform="translate(328 261) rotate(-16) scale(0.9)">
      <path d="M0 0 C -6.5 11 -9.5 24 -6.5 36 C -5 42.5 -2.5 47.5 0.5 52
               C 5 45.5 7.9 36 8.4 26 C 8.9 15.5 6 6.5 2 0.5 Z"
            fill="#17171c" fill-opacity="0.4" stroke="url(#opSil)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M -6.5 34 C -5.5 41 -2.5 46.6 0.5 51.6 C 4.5 45.6 7.5 37.5 8.3 28.5
               C 4 33.5 -1.2 35.5 -6.5 34 Z"
            fill="url(#opGold)" fill-opacity="0.8" stroke="#c9a24b" stroke-width="0.8"/>
      <path d="M0 0.5 C -1.5 16 -1 32 0.5 50.5" fill="none" stroke="#eef1f6" stroke-width="1" opacity="0.9"/>
      <g stroke="#c9cdd6" stroke-width="0.5" opacity="0.6" fill="none">
        <path d="M -1.4 10 L -6 14.6 M -2 19 L -6.6 24.4 M -1.6 28 L -5.4 33.4"/>
        <path d="M 1.4 12 L 5.8 16.6 M 1.6 21 L 6.2 26.4"/>
      </g>
    </g>
    <path d="M340 268 L341.3 272.2 L345.5 273.5 L341.3 274.8 L340 279 L338.7 274.8 L334.5 273.5 L338.7 272.2 Z" fill="#eef1f6" opacity="0.75"/>
  </g>
</svg>
