<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Five scenes of work in Norway: a nurse caring for an elder in a care home, a woman in a hijab wiring a site as an electrician, a bus driver at the wheel, an engineer at a screen, and a chef in a kitchen. Mixed genders and backgrounds, all competent and busy.">
<title>Work: skilled and busy across sectors</title>
<defs>
<linearGradient id="panelLight" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eeeae1"/>
<stop offset="1" stop-color="#e4ded2"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="520" fill="#f7f5f0"/>

<!-- panel backgrounds -->
<rect x="0" y="0" width="240" height="520" fill="url(#panelLight)"/>
<rect x="240" y="0" width="240" height="520" fill="#eeeae1"/>
<rect x="480" y="0" width="240" height="520" fill="url(#panelLight)"/>
<rect x="720" y="0" width="240" height="520" fill="#eeeae1"/>
<rect x="960" y="0" width="240" height="520" fill="url(#panelLight)"/>
<g stroke="#1b3a55" stroke-width="2" opacity="0.25">
<line x1="240" y1="0" x2="240" y2="520"/>
<line x1="480" y1="0" x2="480" y2="520"/>
<line x1="720" y1="0" x2="720" y2="520"/>
<line x1="960" y1="0" x2="960" y2="520"/>
</g>

<!-- PANEL 1: nurse in care home -->
<g transform="translate(120,0)">
<rect x="-120" y="60" width="240" height="120" fill="#4fb8b8" opacity="0.35"/>
<rect x="-60" y="70" width="60" height="70" rx="6" fill="#1f8a8a"/>
<!-- elder seated -->
<g transform="translate(-70,300)">
<rect x="-24" y="-6" width="48" height="70" rx="16" fill="#1b3a55"/>
<circle cx="0" cy="-30" r="24" fill="#d9a271"/>
<path d="M-20 -38 Q-18 -50 0 -52 Q18 -50 20 -38 Q13 -43 0 -44 Q-13 -43 -20 -38Z" fill="#e4ded2"/>
</g>
<!-- nurse standing -->
<g transform="translate(30,300)">
<rect x="-28" y="-16" width="56" height="94" rx="20" fill="#f7f5f0"/>
<rect x="-28" y="-16" width="56" height="94" rx="20" fill="none" stroke="#3fbf9a" stroke-width="4"/>
<circle cx="0" cy="-48" r="27" fill="#8a5a35"/>
<path d="M-24 -56 Q-22 -70 0 -72 Q22 -70 24 -56 Q15 -62 0 -63 Q-15 -62 -24 -56Z" fill="#0b1d2e"/>
<circle cx="0" cy="8" r="10" fill="#3fbf9a"/>
</g>
</g>

<!-- PANEL 2: electrician, woman in hijab -->
<g transform="translate(360,0)">
<rect x="-120" y="40" width="240" height="18" fill="#1b3a55"/>
<rect x="-90" y="58" width="14" height="130" fill="#c9a227"/>
<rect x="76" y="58" width="14" height="130" fill="#c9a227"/>
<g transform="translate(0,320)">
<rect x="-30" y="-14" width="60" height="90" rx="18" fill="#e8a33d"/>
<circle cx="0" cy="-48" r="27" fill="#b07b4d"/>
<path d="M-30 -54 Q0 -84 30 -54 Q32 -20 24 4 L-24 4 Q-32 -20 -30 -54Z" fill="#12293e"/>
<path d="M-26 -60 Q0 -78 26 -60 Q28 -66 20 -70 Q0 -78 -20 -70 Q-28 -66 -26 -60Z" fill="#c9a227"/>
<rect x="-40" y="6" width="16" height="10" rx="4" fill="#12293e"/>
<rect x="-4" y="-90" width="34" height="10" rx="5" fill="#8a5a35" transform="rotate(-70 -4 -90)"/>
</g>
</g>

<!-- PANEL 3: bus driver -->
<g transform="translate(600,0)">
<rect x="-120" y="200" width="240" height="140" fill="#1f8f74" opacity="0.25"/>
<rect x="-110" y="230" width="220" height="90" rx="16" fill="#1b3a55"/>
<rect x="-90" y="240" width="80" height="40" rx="6" fill="#eeeae1"/>
<circle cx="-20" cy="330" r="26" fill="#0b1d2e"/>
<circle cx="-20" cy="330" r="10" fill="#c9a227"/>
<g transform="translate(-20,290)">
<rect x="-24" y="0" width="48" height="60" rx="16" fill="#12293e"/>
<circle cx="0" cy="-24" r="24" fill="#8a5a35"/>
<path d="M-20 -32 Q-18 -46 0 -48 Q18 -46 20 -32 Q12 -37 0 -38 Q-12 -37 -20 -32Z" fill="#e4ded2"/>
</g>
</g>

<!-- PANEL 4: engineer at a screen -->
<g transform="translate(840,0)">
<rect x="-70" y="260" width="140" height="70" rx="6" fill="#1b3a55"/>
<rect x="-60" y="270" width="120" height="50" fill="#3fbf9a" opacity="0.5"/>
<rect x="-8" y="330" width="16" height="20" fill="#12293e"/>
<rect x="-40" y="350" width="80" height="8" rx="4" fill="#c9a227"/>
<g transform="translate(0,300)">
<rect x="-27" y="20" width="54" height="70" rx="18" fill="#1f8a8a"/>
<circle cx="0" cy="-6" r="26" fill="#f0c8a0"/>
<path d="M-30 -14 Q0 -40 30 -14 Q32 24 22 44 L-22 44 Q-32 24 -30 -14Z" fill="#e0c163"/>
</g>
</g>

<!-- PANEL 5: chef in kitchen -->
<g transform="translate(1080,0)">
<rect x="-100" y="80" width="200" height="60" rx="6" fill="#1b3a55"/>
<circle cx="-60" cy="70" r="10" fill="#0b1d2e"/>
<circle cx="-20" cy="70" r="10" fill="#0b1d2e"/>
<circle cx="20" cy="70" r="10" fill="#0b1d2e"/>
<circle cx="60" cy="70" r="10" fill="#0b1d2e"/>
<g transform="translate(0,300)">
<rect x="-28" y="-6" width="56" height="80" rx="18" fill="#f7f5f0"/>
<rect x="-28" y="-6" width="56" height="80" rx="18" fill="none" stroke="#1b3a55" stroke-width="3"/>
<circle cx="0" cy="-40" r="26" fill="#d9a271"/>
<path d="M-24 -50 Q-26 -76 0 -80 Q26 -76 24 -50 Q24 -60 0 -62 Q-24 -60 -24 -50Z" fill="#f7f5f0"/>
<rect x="-22" y="-78" width="44" height="16" rx="8" fill="#f7f5f0"/>
<rect x="14" y="4" width="34" height="9" rx="4" fill="#8a5a35" transform="rotate(-20 14 4)"/>
</g>
</g>
</svg>
