<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Five scenes of skilled work in Norway: a nurse caring for an elder in a care home, a woman in a hijab and hard hat working as an electrician, a bus driver at the wheel, an engineer at a desk, and a chef at the pass. Mixed genders and backgrounds, all competent and busy.">
