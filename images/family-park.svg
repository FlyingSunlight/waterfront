<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="A city park in early spring under low golden light: a father pushes a pram, two women share coffee on a bench, one wearing a hijab and one not, children play on a climbing frame, and an older couple walks past birch trees and patches of melting snow.">
<title>Family life: an early spring afternoon in the park</title>
<defs>
<linearGradient id="skyF" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eeeae1"/>
<stop offset="1" stop-color="#e0c163"/>
</linearGradient>
<radialGradient id="sunF" cx="0.15" cy="0.15" r="0.55">
<stop offset="0" stop-color="#e8a33d" stop-opacity="0.5"/>
<stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="1200" height="520" fill="url(#skyF)"/>
<circle cx="150" cy="90" r="140" fill="url(#sunF)"/>
<circle cx="150" cy="90" r="42" fill="#e8a33d"/>

<!-- ground -->
<rect x="0" y="300" width="1200" height="220" fill="#eeeae1"/>
<path d="M0 300 Q300 280 600 298 Q900 316 1200 292 L1200 320 L0 320Z" fill="#e4ded2"/>

<!-- melting snow patches -->
