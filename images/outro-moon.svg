<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="静かな水平線の上の三日月と、舞い落ちるひとひらのフェザーの線画">
  <defs>
    <linearGradient id="omSil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="omGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c97e"/>
      <stop offset="1" stop-color="#a8823a"/>
    </linearGradient>
    <radialGradient id="omBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BCEFA" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#5BCEFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="omPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A9B8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F5A9B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- faintest aurora at the horizon -->
  <ellipse cx="185" cy="312" rx="235" ry="78" fill="url(#omBlue)"/>
  <ellipse cx="420" cy="312" rx="235" ry="78" fill="url(#omPink)"/>

  <!-- tiny stars -->
  <g fill="#eef1f6">
    <circle cx="82" cy="62" r="1.3" opacity="0.7"/>
    <circle cx="146" cy="126" r="1" opacity="0.5"/>
    <circle cx="214" cy="48" r="1.2" opacity="0.6"/>
    <circle cx="404" cy="44" r="1" opacity="0.55"/>
    <circle cx="478" cy="96" r="1.4" opacity="0.75"/>
    <circle cx="532" cy="168" r="1" opacity="0.5"/>
    <circle cx="500" cy="228" r="1.1" opacity="0.45"/>
    <circle cx="110" cy="212" r="1" opacity="0.4"/>
  </g>
  <g stroke="#eef1f6" stroke-width="1.1" stroke-linecap="round" opacity="0.65">
    <path d="M152 84 v10 M147 89 h10"/>
    <path d="M452 132 v9 M447.5 136.5 h9"/>
  </g>

  <!-- crescent moon (月メタル) -->
  <circle cx="300" cy="140" r="82" fill="none" stroke="url(#omSil)" stroke-width="0.8" opacity="0.25"/>
  <path d="M329 74 A72 72 0 1 0 329 206" fill="none" stroke="url(#omSil)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M329 206 A66 66 0 0 1 329 74" fill="none" stroke="url(#omSil)" stroke-width="2" stroke-linecap="round"/>
  <!-- single gold accent: engraved rim inside the crescent -->
  <path d="M252 180 A63 63 0 0 1 252 100" fill="none" stroke="url(#omGold)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <!-- engraving hints -->
  <g fill="none" stroke="url(#omSil)" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M262 118 C 258 127, 257 138, 259 147"/>
    <path d="M270 162 C 267 168, 266 174, 267 180"/>
  </g>

  <!-- drifting feather -->
  <path d="M392 176 Q 404 202, 409 224" fill="none" stroke="#eef1f6" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.35"/>
  <g transform="translate(410 226) rotate(32)" fill="none" stroke="url(#omSil)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 C -7 12, -9 28, -5 44 C -3 51, 0 56, 2 60 C 7 50, 10 32, 8 16 C 7 8, 4 3, 0 0 Z" stroke-width="1.8"/>
    <path d="M0 2 C 0 22, 1 42, 1 58" stroke-width="1.2"/>
    <g stroke-width="0.9" opacity="0.7">
      <path d="M0 18 L -5 24"/>
      <path d="M0 28 L -5 35"/>
      <path d="M0 38 L -4 45"/>
      <path d="M1 22 L 6 28"/>
      <path d="M1 32 L 6 39"/>
    </g>
  </g>

  <!-- still horizon -->
  <path d="M40 310 H 560" stroke="url(#omSil)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M70 314 H 530" stroke="url(#omSil)" stroke-width="0.7" stroke-linecap="round" opacity="0.25"/>

  <!-- moon's reflection, trembling on the water -->
  <g stroke="url(#omSil)" stroke-width="1.2" stroke-linecap="round" opacity="0.35">
    <path d="M283 322 H 317"/>
    <path d="M290 331 H 312"/>
    <path d="M295 341 H 307"/>
    <path d="M298 351 H 304"/>
  </g>
</svg>
