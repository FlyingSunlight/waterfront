<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="昇る太陽の前で翼をひろげる銀のイーグル">
  <defs>
    <linearGradient id="he-silver" gradientUnits="userSpaceOnUse" x1="200" y1="60" x2="200" y2="262">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="he-wing" gradientUnits="userSpaceOnUse" x1="192" y1="132" x2="24" y2="94">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="he-gold" gradientUnits="userSpaceOnUse" x1="200" y1="104" x2="200" y2="240">
      <stop offset="0" stop-color="#e7c87f"/>
      <stop offset="0.6" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#96762f"/>
    </linearGradient>
    <radialGradient id="he-glow" gradientUnits="userSpaceOnUse" cx="200" cy="172" r="128">
      <stop offset="0" stop-color="#c9a24b" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#c9a24b" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#c9a24b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="he-tq" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#7ccfc8"/>
      <stop offset="0.55" stop-color="#3aa8a0"/>
      <stop offset="1" stop-color="#2d8a84"/>
    </radialGradient>

    <!-- one wing, mirrored below -->
    <g id="he-wingL" fill="none" stroke="url(#he-wing)" stroke-linecap="round" stroke-linejoin="round">
      <!-- leading edge -->
      <path d="M182 138 C150 118 118 106 92 104 C70 102 46 96 26 90" stroke-width="2.4"/>
      <path d="M180 145 C151 127 121 115 96 113" stroke-width="1.1" opacity="0.65"/>
      <!-- primaries -->
      <path d="M94 110 C70 104 48 98 28 92" stroke-width="2"/>
      <path d="M98 117 C72 114 48 111 28 108" stroke-width="1.9"/>
      <path d="M102 124 C76 125 52 126 32 127" stroke-width="1.7"/>
      <path d="M106 131 C80 137 58 143 38 148" stroke-width="1.6"/>
      <path d="M112 138 C88 149 68 159 50 169" stroke-width="1.4"/>
      <path d="M118 143 C96 158 78 171 62 184" stroke-width="1.3"/>
      <path d="M126 148 C106 165 90 179 76 193" stroke-width="1.2"/>
      <!-- covert scallops -->
      <path d="M172 150 q-10 12 -20 10 q-10 11 -20 9 q-10 10 -20 8 q-10 9 -19 7" stroke-width="1.1" opacity="0.8"/>
      <path d="M176 160 q-9 11 -18 9 q-9 10 -18 8 q-9 9 -18 7" stroke-width="1" opacity="0.55"/>
      <!-- shoulder hatch -->
      <path d="M170 142 l-11 -6 M163 150 l-11 -5 M158 158 l-10 -4" stroke-width="0.9" opacity="0.45"/>
    </g>
  </defs>

  <!-- rising sun -->
  <circle cx="200" cy="172" r="128" fill="url(#he-glow)"/>
  <circle cx="200" cy="172" r="120" fill="none" stroke="#8b8f99" stroke-width="0.7" opacity="0.18"/>
  <circle cx="200" cy="172" r="64" fill="none" stroke="url(#he-gold)" stroke-width="1.5"/>
  <circle cx="200" cy="172" r="57" fill="none" stroke="url(#he-gold)" stroke-width="0.6" opacity="0.5"/>
  <g stroke="#c9a24b" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M200 100 V82"  transform="rotate(0 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(15 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(30 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(45 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(60 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(75 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(90 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(105 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(120 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(135 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(150 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(165 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(180 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(195 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(210 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(225 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(240 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(255 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(270 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(285 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(300 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(315 200 172)"/>
    <path d="M200 100 V82"  transform="rotate(330 200 172)"/>
    <path d="M200 100 V90"  transform="rotate(345 200 172)"/>
  </g>

  <!-- horizon -->
  <g stroke="url(#he-gold)" stroke-linecap="round" fill="none">
    <path d="M58 246 H342" stroke-width="1" opacity="0.35"/>
    <path d="M104 256 H296" stroke-width="0.8" opacity="0.18"/>
  </g>

  <!-- wings -->
  <use href="#he-wingL"/>
  <use href="#he-wingL" transform="translate(400 0) scale(-1 1)"/>

  <!-- body -->
  <g fill="none" stroke="url(#he-silver)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M188 128 C179 150 179 178 190 202" stroke-width="2"/>
    <path d="M212 128 C221 150 221 178 210 202" stroke-width="2"/>
    <path d="M190 202 Q200 210 210 202" stroke-width="1.6"/>
    <!-- chest feathering -->
    <path d="M192 162 q8 5 16 0" stroke-width="0.9" opacity="0.55"/>
    <path d="M193 174 q7 5 14 0" stroke-width="0.9" opacity="0.5"/>
    <path d="M195 186 q5 4 10 0" stroke-width="0.9" opacity="0.45"/>
    <!-- head, facing left -->
    <path d="M212 124 C218 116 220 104 213 97 C206 90 194 91 188 99 L178 106 Q174 109 178 112 L184 112 C184 118 188 122 192 126" stroke-width="2"/>
    <path d="M195 118 q6 4 12 1" stroke-width="0.9" opacity="0.5"/>
    <!-- tail -->
    <path d="M191 206 C182 224 172 238 164 248" stroke-width="1.5"/>
    <path d="M196 208 C191 226 186 242 182 252" stroke-width="1.4"/>
    <path d="M200 209 V256" stroke-width="1.4"/>
    <path d="M204 208 C209 226 214 242 218 252" stroke-width="1.4"/>
    <path d="M209 206 C218 224 228 238 236 248" stroke-width="1.5"/>
    <path d="M164 248 Q200 266 236 248" stroke-width="0.9" opacity="0.55"/>
  </g>

  <!-- beak accent -->
  <path d="M179 107 L185 110" stroke="url(#he-gold)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- eye -->
  <circle cx="203" cy="103" r="2.1" fill="#eef1f6"/>

  <!-- turquoise chest stone in silver bezel -->
  <ellipse cx="200" cy="145" rx="6.4" ry="8.4" fill="url(#he-tq)"/>
  <ellipse cx="200" cy="145" rx="8" ry="10" fill="none" stroke="url(#he-silver)" stroke-width="1.3"/>
  <ellipse cx="197.6" cy="141.4" rx="1.7" ry="2.3" fill="#eef1f6" opacity="0.55"/>
</svg>
