<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="A quiet prayer room with soft daylight from a high window, a patterned carpet, an arched mihrab niche, several figures in prayer shown without facial detail, and shoes neatly set by the door.">
<title>A quiet prayer space</title>
<defs>
  <linearGradient id="prayerLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eeeae1"/>
    <stop offset="60%" stop-color="#e4ded2"/>
    <stop offset="100%" stop-color="#eeeae1"/>
  </linearGradient>
  <radialGradient id="windowBeam" cx="0.5" cy="0" r="0.9">
    <stop offset="0%" stop-color="#f7f5f0" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#f7f5f0" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x="0" y="0" width="1000" height="380" fill="url(#prayerLight)"/>
<rect x="0" y="380" width="1000" height="140" fill="#e4ded2"/>

<!-- high window and light beam -->
<rect x="420" y="20" width="160" height="90" rx="8" fill="#1b3a55" opacity="0.15"/>
<rect x="430" y="30" width="140" height="70" fill="#f7f5f0" opacity="0.6"/>
<g stroke="#1b3a55" stroke-width="3" opacity="0.2">
  <line x1="500" y1="30" x2="500" y2="100"/>
  <line x1="430" y1="65" x2="570" y2="65"/>
</g>
<path d="M420 110 L580 110 L680 380 L320 380 Z" fill="url(#windowBeam)"/>

<!-- mihrab niche wall -->
<rect x="0" y="0" width="1000" height="380" fill="none"/>
<path d="M380 380 L380 220 Q500 150 620 220 L620 380 Z" fill="#eeeae1"/>
<path d="M380 380 L380 220 Q500 150 620 220 L620 380 Z" fill="none" stroke="#c9a227" stroke-width="4"/>
<path d="M410 380 L410 235 Q500 178 590 235 L590 380 Z" fill="#1f8a8a" opacity="0.18"/>

<!-- geometric ornament framing the niche -->
<g fill="none" stroke="#c9a227" stroke-width="1.6" opacity="0.55">
  <path d="M340 230 L360 210 L380 230 L360 250 Z"/>
  <path d="M620 230 L640 210 L660 230 L640 250 Z"/>
  <path d="M340 280 L360 260 L380 280 L360 300 Z"/>
  <path d="M620 280 L640 260 L660 280 L640 300 Z"/>
  <path d="M340 330 L360 310 L380 330 L360 350 Z"/>
  <path d="M620 330 L640 310 L660 330 L640 350 Z"/>
</g>
<g fill="#1f8a8a" opacity="0.5">
  <circle cx="360" cy="230" r="3"/><circle cx="640" cy="230" r="3"/>
  <circle cx="360" cy="280" r="3"/><circle cx="640" cy="280" r="3"/>
  <circle cx="360" cy="330" r="3"/><circle cx="640" cy="330" r="3"/>
</g>
<!-- small brass lamp hanging in the niche -->
<line x1="500" y1="150" x2="500" y2="195" stroke="#c9a227" stroke-width="2"/>
<path d="M488 195 Q500 185 512 195 L508 218 Q500 226 492 218 Z" fill="#e0c163" opacity="0.9"/>
<circle cx="500" cy="205" r="18" fill="url(#windowBeam)"/>

<!-- carpet with subtle geometric pattern -->
<g>
  <rect x="120" y="380" width="760" height="120" rx="4" fill="#1b3a55" opacity="0.85"/>
  <rect x="140" y="392" width="720" height="96" rx="3" fill="#1b3a55"/>
  <g fill="none" stroke="#c9a227" stroke-width="1.4" opacity="0.45">
    <path d="M180 440 L200 420 L220 440 L200 460 Z"/>
    <path d="M260 440 L280 420 L300 440 L280 460 Z"/>
    <path d="M340 440 L360 420 L380 440 L360 460 Z"/>
    <path d="M420 440 L440 420 L460 440 L440 460 Z"/>
    <path d="M500 440 L520 420 L540 440 L520 460 Z"/>
    <path d="M580 440 L600 420 L620 440 L600 460 Z"/>
    <path d="M660 440 L680 420 L700 440 L680 460 Z"/>
    <path d="M740 440 L760 420 L780 440 L760 460 Z"/>
  </g>
  <rect x="140" y="392" width="720" height="96" rx="3" fill="none" stroke="#e0c163" stroke-width="2" opacity="0.5"/>
</g>

<!-- four figures in prayer, from behind, no facial detail -->
<g fill="#12293e">
  <!-- standing figure -->
  <g transform="translate(280,330)">
    <path d="M-16 78 Q-20 10 0 -4 Q20 10 16 78 Z" fill="#1b3a55"/>
    <circle cx="0" cy="-16" r="13" fill="#1b3a55"/>
    <rect x="-14" y="74" width="12" height="10" fill="#12293e"/>
    <rect x="2" y="74" width="12" height="10" fill="#12293e"/>
  </g>
  <!-- bowing figure -->
  <g transform="translate(400,340)">
    <path d="M-4 40 Q-40 20 -60 30 Q-56 42 -20 48 Q0 50 8 44 Z" fill="#1b3a55"/>
    <circle cx="-58" cy="26" r="12" fill="#1b3a55"/>
  </g>
  <!-- prostrate figure -->
  <g transform="translate(560,352)">
    <path d="M-50 26 Q-10 6 40 14 Q42 26 20 32 Q-20 38 -50 32 Z" fill="#12293e"/>
  </g>
  <!-- standing figure, woman, headscarf silhouette -->
  <g transform="translate(700,326)">
    <path d="M-18 84 Q-24 6 0 -10 Q24 6 18 84 Z" fill="#1b3a55"/>
    <path d="M-17 -6 Q0 -22 17 -6 Q19 20 10 30 Q0 20 -10 30 Q-19 20 -17 -6 Z" fill="#12293e"/>
    <rect x="-15" y="80" width="13" height="10" fill="#0b1d2e"/>
    <rect x="2" y="80" width="13" height="10" fill="#0b1d2e"/>
  </g>
</g>

<!-- shoes neatly by the door -->
<g transform="translate(80,470)">
  <ellipse cx="0" cy="8" rx="26" ry="9" fill="#8a5a35"/>
  <ellipse cx="34" cy="8" rx="26" ry="9" fill="#8a5a35"/>
  <ellipse cx="80" cy="6" rx="24" ry="8" fill="#1b3a55"/>
  <ellipse cx="112" cy="6" rx="24" ry="8" fill="#1b3a55"/>
  <ellipse cx="160" cy="10" rx="22" ry="7" fill="#b07b4d"/>
  <ellipse cx="190" cy="10" rx="22" ry="7" fill="#b07b4d"/>
</g>

<!-- door frame suggestion, right edge -->
<rect x="900" y="140" width="10" height="240" fill="#c9a227" opacity="0.5"/>

<!-- geometric ceiling border strip -->
<g fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.3">
  <path d="M0 16 L20 0 L40 16 L20 32 Z"/>
  <path d="M40 16 L60 0 L80 16 L60 32 Z"/>
  <path d="M920 16 L940 0 L960 16 L940 32 Z"/>
  <path d="M960 16 L980 0 L1000 16 L980 32 Z"/>
</g>
</svg>
