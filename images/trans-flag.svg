<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="トランスジェンダー・プライドフラッグ">
  <defs>
    <!-- gentle wave along the flag -->
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="0.18" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#000" stop-opacity="0.04"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.85" stop-color="#000" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- waving flag: five stripes drawn as parallel ribbons following one curve -->
  <g filter="url(#soft)">
    <path d="M60 120 C260 90 480 150 840 110 L840 198 C480 238 260 178 60 208 Z" fill="#5BCEFA"/>
    <path d="M60 208 C260 178 480 238 840 198 L840 286 C480 326 260 266 60 296 Z" fill="#F5A9B8"/>
    <path d="M60 296 C260 266 480 326 840 286 L840 374 C480 414 260 354 60 384 Z" fill="#FFFFFF"/>
    <path d="M60 384 C260 354 480 414 840 374 L840 462 C480 502 260 442 60 472 Z" fill="#F5A9B8"/>
    <path d="M60 472 C260 442 480 502 840 462 L840 550 C480 590 260 530 60 560 Z" fill="#5BCEFA"/>
    <!-- unified light/shadow across the wave -->
    <path d="M60 120 C260 90 480 150 840 110 L840 550 C480 590 260 530 60 560 Z" fill="url(#shade)"/>
  </g>
</svg>
