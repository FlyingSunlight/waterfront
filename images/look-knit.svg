      <path d="M194 238 C185 236 176 236 168 238"/>
      <path d="M193 243 C187 243 181 244 176 245"/>
      <path d="M205 233.5 C216 230 228 229 238 231"/>
      <path d="M206 238 C215 236 224 236 232 238"/>
      <path d="M207 243 C213 243 219 244 224 245"/>
      <path d="M198 239 C199 241 201 241 202 239"/>
      <path d="M197.5 243 C199 245 201 245 202.5 243"/>
