      <path d="M178 208 C176 238 175 268 174 298"/>
      <path d="M200 206 C200 236 200 268 200 288"/>
      <path d="M222 207 C224 238 225 268 226 298"/>
      <path d="M242 213 C244 240 246 268 247 296"/>
      <path d="M128 230 C124 252 121 274 119 296"/>
      <path d="M272 228 C276 250 279 274 281 296"/>
    </g>
