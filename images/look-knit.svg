    <path d="M198.5 253 C198 258 198 263 198.5 267" fill="none" stroke-width="0.9"/>
    <path d="M201.5 253 C202 258 202 263 201.5 267" fill="none" stroke-width="0.9"/>
    <path d="M205 251 C206.5 257 207 262 206 266" fill="none" stroke-width="0.9"/>
