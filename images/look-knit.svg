    <path d="M202 231 C214 227 232 226 246 229 C245 234 243 240 240 244 C237 242 235 241 233 241 C233 244 232 246 230 247.5 C227 245.5 225 244.5 223 244.5 C222 247 220 248.7 217 249.5 C215 247.5 213 246.5 211 246.5 C209 248 206 248.5 203 247.5 C202 243 201.5 237 202 233 Z"
