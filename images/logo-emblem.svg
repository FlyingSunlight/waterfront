<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="イーグルの紋章">
  <defs>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="gld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c97e"/>
      <stop offset="1" stop-color="#a8823a"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#sil)" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#sil)" stroke-width="0.8" opacity="0.6"/>

  <!-- sun rays -->
  <g stroke="url(#gld)" stroke-width="1.4" opacity="0.85">
    <line x1="100" y1="22" x2="100" y2="34"/>
    <line x1="140" y1="33" x2="134" y2="43"/>
    <line x1="60" y1="33" x2="66" y2="43"/>
    <line x1="164" y1="62" x2="154" y2="68"/>
    <line x1="36" y1="62" x2="46" y2="68"/>
  </g>

  <!-- eagle: spread wings, geometric engraved style -->
  <g fill="none" stroke="url(#sil)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- left wing -->
    <path d="M100 96 C86 84 68 78 40 80 C52 88 56 94 58 100 C66 98 72 99 76 102 C72 106 70 111 70 117 C78 112 85 110 91 111"/>
    <!-- right wing -->
    <path d="M100 96 C114 84 132 78 160 80 C148 88 144 94 142 100 C134 98 128 99 124 102 C128 106 130 111 130 117 C122 112 115 110 109 111"/>
    <!-- head -->
    <path d="M100 96 C97 88 97 80 100 74 C103 80 106 84 111 86 C107 88 104 91 103 96"/>
    <!-- body + tail -->
    <path d="M96 104 C96 116 97 126 100 134 C103 126 104 116 104 104"/>
    <path d="M92 134 L100 148 L108 134"/>
    <path d="M96 140 L100 152 L104 140"/>
  </g>
  <!-- eye -->
  <circle cx="102.5" cy="79" r="1.6" fill="#eef1f6"/>

  <!-- turquoise sun-stone below -->
  <circle cx="100" cy="163" r="6" fill="#3aa8a0" stroke="url(#sil)" stroke-width="1.4"/>

  <!-- side feathers on ring -->
  <g fill="none" stroke="url(#sil)" stroke-width="1.4" opacity="0.8">
    <path d="M24 118 C28 128 34 136 42 141 M24 118 C30 122 36 124 42 141"/>
    <path d="M176 118 C172 128 166 136 158 141 M176 118 C170 122 164 124 158 141"/>
  </g>
</svg>
