<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Inside a halal grocery in Norway: shelves of spices and rice, fresh vegetables, a butcher's counter with a geometric certification badge, and a shopkeeper handing a bag to a customer while two others chat.">
<title>Inside a halal grocery</title>
<defs>
  <linearGradient id="marketLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e0c163" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#e0c163" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="520" fill="#f7f5f0"/>
<rect x="0" y="0" width="1200" height="220" fill="url(#marketLight)"/>

<!-- back wall -->
<rect x="0" y="40" width="1200" height="180" fill="#eeeae1"/>

<!-- ============ shelving unit left: spices and rice ============ -->
<g>
  <rect x="30" y="60" width="330" height="300" fill="#e4ded2"/>
  <rect x="30" y="60" width="330" height="300" fill="none" stroke="#c9a227" stroke-width="3"/>
  <!-- shelf boards -->
  <g fill="#1b3a55" opacity="0.9">
    <rect x="30" y="130" width="330" height="8"/>
    <rect x="30" y="200" width="330" height="8"/>
    <rect x="30" y="270" width="330" height="8"/>
    <rect x="30" y="340" width="330" height="8"/>
  </g>
  <!-- spice jars row 1 -->
  <g>
    <rect x="42" y="90" width="26" height="36" rx="3" fill="#e8a33d"/>
    <rect x="72" y="86" width="26" height="40" rx="3" fill="#c9a227"/>
    <rect x="102" y="92" width="26" height="34" rx="3" fill="#ba0c2f" opacity="0.75"/>
    <rect x="132" y="88" width="26" height="38" rx="3" fill="#e0c163"/>
    <rect x="162" y="90" width="26" height="36" rx="3" fill="#e8a33d"/>
    <rect x="192" y="86" width="26" height="40" rx="3" fill="#8a5a35"/>
    <rect x="222" y="92" width="26" height="34" rx="3" fill="#c9a227"/>
    <rect x="252" y="88" width="26" height="38" rx="3" fill="#ba0c2f" opacity="0.7"/>
    <rect x="282" y="90" width="26" height="36" rx="3" fill="#e0c163"/>
    <rect x="312" y="86" width="26" height="40" rx="3" fill="#e8a33d"/>
    <g fill="#f7f5f0" opacity="0.85">
      <rect x="46" y="94" width="18" height="8" rx="2"/><rect x="76" y="90" width="18" height="8" rx="2"/>
      <rect x="106" y="96" width="18" height="8" rx="2"/><rect x="136" y="92" width="18" height="8" rx="2"/>
      <rect x="166" y="94" width="18" height="8" rx="2"/><rect x="196" y="90" width="18" height="8" rx="2"/>
      <rect x="226" y="96" width="18" height="8" rx="2"/><rect x="256" y="92" width="18" height="8" rx="2"/>
      <rect x="286" y="94" width="18" height="8" rx="2"/><rect x="316" y="90" width="18" height="8" rx="2"/>
    </g>
  </g>
  <!-- rice sacks row 2 -->
  <g>
    <rect x="42" y="140" width="60" height="56" rx="5" fill="#e4ded2" stroke="#1b3a55" stroke-width="2"/>
    <rect x="108" y="140" width="60" height="56" rx="5" fill="#eeeae1" stroke="#1b3a55" stroke-width="2"/>
    <rect x="174" y="145" width="60" height="51" rx="5" fill="#e4ded2" stroke="#1b3a55" stroke-width="2"/>
    <rect x="240" y="140" width="60" height="56" rx="5" fill="#eeeae1" stroke="#1b3a55" stroke-width="2"/>
    <rect x="60" y="152" width="24" height="14" fill="#c9a227" opacity="0.8"/>
    <rect x="126" y="152" width="24" height="14" fill="#3fbf9a" opacity="0.8"/>
    <rect x="192" y="156" width="24" height="14" fill="#c9a227" opacity="0.8"/>
    <rect x="258" y="152" width="24" height="14" fill="#3fbf9a" opacity="0.8"/>
  </g>
  <!-- canned / boxed goods row 3 -->
  <g>
    <rect x="42" y="212" width="34" height="50" fill="#1f8a8a"/>
    <rect x="80" y="212" width="34" height="50" fill="#4fb8b8"/>
    <rect x="118" y="216" width="34" height="46" fill="#c9a227"/>
    <rect x="156" y="212" width="34" height="50" fill="#1f8a8a"/>
    <rect x="194" y="216" width="34" height="46" fill="#e8a33d"/>
    <rect x="232" y="212" width="34" height="50" fill="#4fb8b8"/>
    <rect x="270" y="216" width="34" height="46" fill="#c9a227"/>
    <rect x="308" y="212" width="34" height="50" fill="#1f8a8a"/>
  </g>
  <!-- lentils / pulses jars row 4 -->
  <g>
    <ellipse cx="60" cy="308" rx="20" ry="26" fill="#e0c163"/>
    <ellipse cx="104" cy="308" rx="20" ry="26" fill="#8a5a35"/>
    <ellipse cx="148" cy="308" rx="20" ry="26" fill="#c9a227"/>
    <ellipse cx="192" cy="308" rx="20" ry="26" fill="#3fbf9a" opacity="0.85"/>
    <ellipse cx="236" cy="308" rx="20" ry="26" fill="#e0c163"/>
    <ellipse cx="280" cy="308" rx="20" ry="26" fill="#8a5a35"/>
    <ellipse cx="324" cy="308" rx="20" ry="26" fill="#c9a227"/>
  </g>
</g>

<!-- ============ fresh vegetable crates, centre ============ -->
<g>
  <rect x="410" y="290" width="90" height="30" rx="3" fill="#1b3a55"/>
  <circle cx="425" cy="286" r="12" fill="#3fbf9a"/>
  <circle cx="450" cy="282" r="12" fill="#1f8f74"/>
  <circle cx="475" cy="286" r="12" fill="#3fbf9a"/>
  <circle cx="490" cy="290" r="10" fill="#1f8f74"/>

  <rect x="410" y="330" width="90" height="30" rx="3" fill="#1b3a55"/>
  <ellipse cx="425" cy="326" rx="12" ry="9" fill="#e8a33d"/>
  <ellipse cx="450" cy="322" rx="12" ry="9" fill="#c9a227"/>
  <ellipse cx="475" cy="326" rx="12" ry="9" fill="#e8a33d"/>
  <ellipse cx="495" cy="330" rx="10" ry="8" fill="#c9a227"/>

  <rect x="410" y="370" width="90" height="30" rx="3" fill="#1b3a55"/>
  <path d="M420 368 Q425 352 432 368 Z" fill="#3fbf9a"/>
  <path d="M440 368 Q446 350 452 368 Z" fill="#1f8f74"/>
  <path d="M460 368 Q466 352 472 368 Z" fill="#3fbf9a"/>
  <path d="M478 368 Q484 350 490 368 Z" fill="#1f8f74"/>
</g>

<!-- second small shelf between veg and counter -->
<g>
  <rect x="410" y="60" width="130" height="210" fill="#e4ded2"/>
  <rect x="410" y="60" width="130" height="210" fill="none" stroke="#c9a227" stroke-width="3"/>
  <rect x="410" y="130" width="130" height="7" fill="#1b3a55" opacity="0.9"/>
  <rect x="410" y="200" width="130" height="7" fill="#1b3a55" opacity="0.9"/>
  <rect x="422" y="90" width="22" height="34" rx="3" fill="#ba0c2f" opacity="0.7"/>
  <rect x="450" y="86" width="22" height="38" rx="3" fill="#e0c163"/>
  <rect x="478" y="90" width="22" height="34" rx="3" fill="#c9a227"/>
  <rect x="420" y="150" width="50" height="42" rx="4" fill="#eeeae1" stroke="#1b3a55" stroke-width="2"/>
  <rect x="478" y="150" width="50" height="42" rx="4" fill="#e4ded2" stroke="#1b3a55" stroke-width="2"/>
  <ellipse cx="435" cy="230" rx="18" ry="22" fill="#8a5a35"/>
  <ellipse cx="475" cy="230" rx="18" ry="22" fill="#c9a227"/>
  <ellipse cx="515" cy="230" rx="16" ry="20" fill="#e0c163"/>
</g>

<!-- ============ butcher's counter, back right ============ -->
<g>
  <rect x="600" y="120" width="560" height="8" fill="#12293e"/>
  <rect x="600" y="60" width="560" height="60" fill="#eeeae1"/>
  <g fill="none" stroke="#c9a227" stroke-width="1.4" opacity="0.5">
    <path d="M640 105 L655 90 L670 105 L655 120 Z"/>
    <path d="M670 105 L685 90 L700 105 L685 120 Z"/>
    <path d="M700 105 L715 90 L730 105 L715 120 Z"/>
  </g>

  <!-- certification badge: abstract geometric star, no lettering -->
  <g transform="translate(1080,92)">
    <circle r="34" fill="#f7f5f0" stroke="#c9a227" stroke-width="3"/>
    <g fill="#1f8f74">
      <path d="M0 -24 L7 -7 L24 0 L7 7 L0 24 L-7 7 L-24 0 L-7 -7 Z"/>
    </g>
    <circle r="8" fill="#c9a227"/>
  </g>

  <!-- counter body and glass case -->
  <rect x="600" y="300" width="560" height="90" fill="#1b3a55"/>
  <rect x="612" y="240" width="536" height="62" fill="#e4ded2" opacity="0.55" stroke="#1b3a55" stroke-width="2"/>
  <rect x="630" y="256" width="70" height="34" rx="4" fill="#b07b4d"/>
  <rect x="716" y="256" width="70" height="34" rx="4" fill="#8a5a35"/>
  <rect x="802" y="256" width="70" height="34" rx="4" fill="#b07b4d"/>
  <rect x="888" y="256" width="70" height="34" rx="4" fill="#8a5a35"/>
  <rect x="600" y="292" width="560" height="10" fill="#c9a227"/>
</g>

<!-- shopkeeper handing a bag across counter -->
<g transform="translate(940,220)">
  <path d="M-16 84 Q-20 20 0 8 Q20 20 16 84 Z" fill="#1f8a8a"/>
  <circle cx="0" cy="-6" r="14" fill="#8a5a35"/>
  <rect x="-10" y="-14" width="20" height="10" rx="4" fill="#eeeae1"/>
  <path d="M14 30 L48 44" stroke="#1f8a8a" stroke-width="10" stroke-linecap="round"/>
  <path d="M42 38 L64 46 L58 62 L38 56 Z" fill="#e4ded2" stroke="#c9a227" stroke-width="2"/>
</g>

<!-- two customers chatting, foreground -->
<g transform="translate(140,410)">
  <ellipse cx="20" cy="96" rx="60" ry="7" fill="#1b3a55" opacity="0.15"/>
  <g>
    <path d="M-16 44 Q-20 -10 0 -20 Q20 -10 16 44 Z" fill="#ba0c2f" opacity="0.7"/>
    <path d="M-15 -26 Q0 -40 15 -26 Q14 0 6 12 Q0 16 -6 12 Q-14 0 -15 -26 Z" fill="#e4ded2"/>
    <circle cx="0" cy="-22" r="12" fill="#d9a271"/>
    <rect x="-13" y="40" width="11" height="28" fill="#0b1d2e"/>
    <rect x="2" y="40" width="11" height="28" fill="#0b1d2e"/>
  </g>
  <g transform="translate(50,6)">
    <path d="M-15 42 Q-18 -8 0 -18 Q18 -8 15 42 Z" fill="#1b3a55"/>
    <circle cx="0" cy="-24" r="12" fill="#b07b4d"/>
    <rect x="-12" y="38" width="10" height="26" fill="#12293e"/>
    <rect x="2" y="38" width="10" height="26" fill="#12293e"/>
    <rect x="0" y="10" width="26" height="30" rx="3" fill="#e4ded2" opacity="0.9"/>
  </g>
</g>

<!-- floor -->
<rect x="0" y="440" width="1200" height="80" fill="#e4ded2"/>
<rect x="0" y="440" width="1200" height="6" fill="#eeeae1"/>
</svg>
