<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="フェザーペンダントを胸に、まっすぐ前を見つめる女性の肖像線画">
  <defs>
    <linearGradient id="hpSil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="hpHair" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.5" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8b8f99"/>
    </linearGradient>
    <linearGradient id="hpGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c97e"/>
      <stop offset="1" stop-color="#a8823a"/>
    </linearGradient>
    <radialGradient id="hpTq" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#7ccfc8"/>
      <stop offset="0.6" stop-color="#3aa8a0"/>
      <stop offset="1" stop-color="#2d8a84"/>
    </radialGradient>
    <radialGradient id="hpBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BCEFA" stop-opacity="0.11"/>
      <stop offset="0.6" stop-color="#5BCEFA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5BCEFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hpPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A9B8" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#F5A9B8" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F5A9B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="hpSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- faintest aurora behind her -->
  <ellipse cx="122" cy="196" rx="210" ry="160" fill="url(#hpBlue)"/>
  <ellipse cx="292" cy="176" rx="200" ry="150" fill="url(#hpPink)"/>

  <!-- quiet halo, echo of sun and moon metal -->
  <circle cx="208" cy="130" r="103" fill="none" stroke="#8b8f99" stroke-width="0.7" opacity="0.18"/>
  <circle cx="208" cy="130" r="95" fill="none" stroke="url(#hpGold)" stroke-width="0.5" opacity="0.14"/>

  <!-- drifting feather outlines -->
  <g fill="none" stroke="url(#hpSil)" stroke-linecap="round" stroke-linejoin="round" opacity="0.36">
    <g transform="translate(58 72) rotate(24) scale(0.5)">
      <path d="M0 0 C -6 10 -8 24 -4 38 C -2 44 0 48 2 52 C 6 43 8 28 6 14 C 5 7 3 3 0 0 Z" stroke-width="1.7"/>
      <path d="M0 3 C 0 20 1 36 1.6 49" stroke-width="1.1"/>
      <path d="M0 16 L -4 21 M0 27 L -4 33 M1 20 L 5 25 M1 31 L 5 37" stroke-width="0.9" opacity="0.7"/>
    </g>
    <g transform="translate(346 60) rotate(-20) scale(0.44)">
      <path d="M0 0 C -6 10 -8 24 -4 38 C -2 44 0 48 2 52 C 6 43 8 28 6 14 C 5 7 3 3 0 0 Z" stroke-width="1.7"/>
      <path d="M0 3 C 0 20 1 36 1.6 49" stroke-width="1.1"/>
      <path d="M0 16 L -4 21 M0 27 L -4 33 M1 20 L 5 25 M1 31 L 5 37" stroke-width="0.9" opacity="0.7"/>
    </g>
    <g transform="translate(76 236) rotate(42) scale(0.4)" opacity="0.8">
      <path d="M0 0 C -6 10 -8 24 -4 38 C -2 44 0 48 2 52 C 6 43 8 28 6 14 C 5 7 3 3 0 0 Z" stroke-width="1.7"/>
      <path d="M0 3 C 0 20 1 36 1.6 49" stroke-width="1.1"/>
    </g>
  </g>

  <!-- skin: warm tan tonal fill under the silver line (face + neck + chest as one) -->
  <g filter="url(#hpSoft)">
    <path d="M185.5 72 C178 88 173.5 102 173.2 115 C173 131 178 146 187 156
             C192 161.5 199 163.4 205 161.2 C213.5 158 224 151.5 232 143.5
             C235.5 129 238 110 241 96 C234 82 222 73.5 208 71.5
             C200 70.4 191.5 69.6 185.5 72 Z
             M188 154 L185 202 C172 211 152 217 139 223 C132.6 226.6 128 234 126 244
             L129.5 268 C155 255 195 249 225 251 C255 253 283 259 299 267
             L303 241 C295 229 271 219 251 211 L237 201 L233 146 L206 160 Z"
          fill="#c99e78" fill-opacity="0.35"/>
    <path d="M190 156 C200 166 218 166 231 153 L234 194 C220 206 200 206 186 198 Z"
          fill="#c99e78" fill-opacity="0.14"/>
  </g>

  <!-- hair mass: soft silver tone silhouette -->
  <path d="M185.5 72 C183 60 190 50 202 46.5 C220 41 244 46 258 58
           C272 70 279 88 281 108 C283 130 280 152 283 176
           C286 206 284 224 290 246 C294 264 296 284 291 300
