<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Five vignettes tracing Pakistani migration to Norway from around 1970 to today: young men arriving at a dock with suitcases, shipyard work with a crane and sparks, a family arriving and a first small shop opening, a busy grocery with produce outside and children in school clothes, and a multigenerational family outside a modern building today, linked by a timeline">
