<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="A calm advice-office room. A volunteer caseworker sits at a table with a newly arrived mother and her child, papers and an open laptop and headphones between them, two glasses of water set out. Behind them a wall holds shelves of ring binders, a noticeboard with coloured slips, a window with winter daylight and a bare birch tree outside, and a plant. In the background a second desk hosts another quiet conversation.">
<title>Advice office: a caseworker meets a newly arrived family</title>
