<stop offset="0" stop-color="#f7f5f0"/>
<stop offset="1" stop-color="#e4ded2"/>
</linearGradient>
<radialGradient id="daylight" cx="0.25" cy="0.15" r="0.9">
<stop offset="0" stop-color="#f7f5f0" stop-opacity="0.55"/>
<stop offset="1" stop-color="#f7f5f0" stop-opacity="0"/>
</radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4fb8b8"/>
<stop offset="1" stop-color="#1f8a8a"/>
</linearGradient>
